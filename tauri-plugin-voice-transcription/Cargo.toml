[package]
name = "tauri-plugin-voice-transcription"
version = "0.5.3"
edition = "2021"
links = "tauri-plugin-voice-transcription"
authors = ["Juno Contributors"]
description = "A Tauri plugin for voice transcription and dictation using Whisper"
license = "MIT OR Apache-2.0"
repository = "https://github.com/juno-app/tauri-plugin-voice-transcription"
homepage = "https://github.com/juno-app/tauri-plugin-voice-transcription"
readme = "README.md"
keywords = ["tauri", "plugin", "voice", "transcription", "whisper"]
categories = ["multimedia::audio", "api-bindings"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[lib]
name = "tauri_plugin_voice_transcription"
crate-type = ["cdylib", "rlib"]

[dependencies]
tauri = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
whisper-rs = "0.11.0"
parakeet-rs = "0.3"
cpal = "0.15"
rubato = "0.14.1"
hound = "3.5"
tracing = "0.1"
thiserror = "1.0"
once_cell = "1.17"
regex = "1"
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
base64 = "0.22"
chrono = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc-foundation = "0.1"
cocoa = "0.25"
cocoa-foundation = "0.1"
block = "0.1"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["full"] }

[features]
default = []
download-models = []
cargo-clippy = []

# NOTE: there is deliberately no `[[example]]` here. One used to declare
# `examples/example.rs`, which does not exist — `examples/` holds only
# `basic-app.tsx` and `integration.md`. Any workspace-wide cargo command that
# resolves targets (`cargo fmt --all`, `cargo package`) failed outright on the
# missing file. Re-add the entry only alongside a real .rs file.
