[package]
name = "tauri-plugin-voice-transcription"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-voice-transcription"
authors = ["Juno Contributors"]
description = "A Tauri plugin for voice transcription and dictation using Whisper"
license = "MIT OR Apache-2.0"
repository = "https://github.com/juno-app/tauri-plugin-voice-transcription"
homepage = "https://github.com/juno-app/tauri-plugin-voice-transcription"
readme = "README.md"
keywords = ["tauri", "plugin", "voice", "transcription", "whisper"]
categories = ["multimedia::audio", "api-bindings"]

[build-dependencies]
tauri-plugin = { version = "2.0.0-beta", features = ["build"] }

[lib]
name = "tauri_plugin_voice_transcription"
crate-type = ["cdylib", "rlib"]

[dependencies]
# CRITICAL FIX: Make whisper-rs optional and add platform-specific optimizations
whisper-rs = { version = "0.11.0", default-features = false, features = [
    "coreml",
] }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0.0-beta", features = [
    "macos-private-api",
    "tray-icon",
    "unstable",
] }
thiserror = "1.0"
log = "0.4"
hound = "3.5"
# CRITICAL FIX: Audio libraries with platform compatibility
cpal = { version = "0.15", default-features = false, features = ["jack"] }
rubato = "0.14.1"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
tracing = "0.1"

# CRITICAL FIX: Platform-specific dependencies
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
# Fallback dependencies for non-macOS platforms

[dev-dependencies]
tauri = { version = "2.0.0-beta", features = ["test"] }
tokio = { version = "1", features = ["full"] }

[features]
default = []
# CRITICAL FIX: Platform-specific features
macos-optimized = ["whisper-rs/metal"]
linux-compatible = []
# CRITICAL FIX: Memory optimization features
small-model = []
lazy-loading = []
download-models = []

[[example]]
name = "example"
path = "examples/example.rs"
