[build]
# Increase parallel jobs for faster builds (adjust based on your CPU cores)
jobs = 8

# Enable incremental compilation
incremental = true

# Enable better caching
[profile.dev]
incremental = true

[env]
# Speed up builds by avoiding unnecessary recompilation
CARGO_INCREMENTAL = "1"
CARGO_CACHE_RUSTC_INFO = "1"

# Skip documentation builds during development
RUSTDOCFLAGS = "--cfg docsrs"

# Link the C runtime statically on Windows. A fresh Windows 11 install has no
# vcruntime140.dll, so a dynamically linked exe exits with 0xC0000135 before
# main runs (LAC-6321 spike).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
