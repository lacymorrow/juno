version: '3.8'

services:
  juno-backend:
    build: .
    container_name: juno-cloud-backend
    restart: unless-stopped

    # Environment variables
    environment:
      - NODE_ENV=production
      - PORT=8080
      - WS_PORT=8080
      - HOST=0.0.0.0

      # These should be set in your .env file or passed via environment
      - JWT_SECRET=${JWT_SECRET}
      - HMAC_SECRET=${HMAC_SECRET}

      # Database
      - DB_PATH=/app/data/juno.db
      - DB_BACKUP_INTERVAL=3600000

      # Rate limiting
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100

      # Logging
      - LOG_LEVEL=info
      - LOG_FILE=/app/logs/server.log
      - LOG_MAX_SIZE=10m
      - LOG_MAX_FILES=5

      # WebSocket settings
      - WS_HEARTBEAT_INTERVAL=30000
      - WS_CONNECTION_TIMEOUT=300000

      # Security
      - BCRYPT_ROUNDS=12
      - CORS_ORIGIN=*

      # Features
      - PREMIUM_ENABLED=true
      - METRICS_ENABLED=true
      - ENABLE_COMMAND_HISTORY=true
      - MAX_COMMAND_HISTORY=1000
      - MAX_CONCURRENT_COMMANDS=10
      - COMMAND_TIMEOUT_MS=30000
      - HEALTH_CHECK_INTERVAL=60000

    # Ports
    ports:
      - "8080:8080"

    # Volume mounts for persistence
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Resource limits (adjust based on your Unraid system)
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Redis for scaling (uncomment if needed)
  # redis:
  #   image: redis:7-alpine
  #   container_name: juno-redis
  #   restart: unless-stopped
  #   volumes:
  #     - redis_data:/data
  #   command: redis-server --appendonly yes
  #   deploy:
  #     resources:
