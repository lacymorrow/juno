steps:
# Build the container image
    - name: 'gcr.io/cloud-builders/docker'
args: ['build', '-t', 'gcr.io/$PROJECT_ID/juno-backend', '.']

# Push the container image to Container Registry
    - name: 'gcr.io/cloud-builders/docker'
args: ['push', 'gcr.io/$PROJECT_ID/juno-backend']

# Deploy container image to Cloud Run
    - name: 'gcr.io/cloud-builders/gcloud'
args:
- 'run'
    - 'deploy'
    - 'juno-backend'
    - '--image=gcr.io/$PROJECT_ID/juno-backend'
    - '--region=us-central1'
    - '--platform=managed'
    - '--allow-unauthenticated'
    - '--port=8080'
    - '--memory=512Mi'
    - '--cpu=1'
    - '--max-instances=10'
    - '--set-env-vars=NODE_ENV=production,PORT=8080,LOG_LEVEL=info'
    - '--set-secrets=JWT_SECRET=jwt-secret:latest,HMAC_SECRET=hmac-secret:latest'

images:
- gcr.io / $PROJECT_ID / juno - backend
