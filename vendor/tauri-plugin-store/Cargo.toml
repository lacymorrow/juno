# Vendored copy of https://crates.io/crates/tauri-plugin-store 2.4.4
# (Apache-2.0 OR MIT, Tauri Programme within The Commons Conservancy).
# Pulled in via [patch.crates-io] in the workspace Cargo.toml.
#
# Upstream saves a store with `fs::write`, which truncates the file and then
# writes it. A crash, a force quit or a full disk in between leaves a
# truncated JSON file, and on the next launch upstream swallows the parse
# error, starts empty and overwrites the file, so every setting is gone
# without a word. The only change here is in src/store.rs: `StoreInner::save`
# writes a temp file in the same folder, fsyncs it, renames it over the
# original and fsyncs the folder, so the file on disk is always the old one
# or the new one.
#
# Drop this directory once upstream writes atomically.

[package]
edition = "2021"
rust-version = "1.77.2"
name = "tauri-plugin-store"
version = "2.4.4"
authors = ["Tauri Programme within The Commons Conservancy"]
build = "build.rs"
links = "tauri-plugin-store"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Simple, persistent key-value store."
readme = "README.md"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/tauri-apps/plugins-workspace"

[package.metadata.platforms.support.windows]
level = "full"
notes = ""

[package.metadata.platforms.support.linux]
level = "full"
notes = ""

[package.metadata.platforms.support.macos]
level = "full"
notes = ""

[package.metadata.platforms.support.android]
level = "full"
notes = ""

[package.metadata.platforms.support.ios]
level = "full"
notes = ""

[lib]
name = "tauri_plugin_store"
path = "src/lib.rs"

[dependencies.dunce]
version = "1"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.tauri]
version = "2.10"
default-features = false

[dependencies.thiserror]
version = "2"

[dependencies.tokio]
version = "1"
features = [
    "sync",
    "time",
    "macros",
]

[dependencies.tracing]
version = "0.1"

[dev-dependencies.tauri]
version = "2.10"
features = ["wry"]
default-features = false

[build-dependencies.tauri-plugin]
version = "2.5"
features = ["build"]

[target.'cfg(target_os = "ios")'.dependencies.tauri]
version = "2.10"
features = ["wry"]
default-features = false
