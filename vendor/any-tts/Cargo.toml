[package]
edition = "2021"
rust-version = "1.83"
name = "any-tts"
version = "0.1.3"
build = false
include = [
    "/README.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/SUPPORT.md",
    "/examples/**",
    "/src/**",
    "/tests/**",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A Rust TTS library with Candle backends and runtime adapters for modern open TTS models"
homepage = "https://flow-like.com"
documentation = "https://docs.rs/any-tts"
readme = "README.md"
keywords = [
    "tts",
    "text-to-speech",
    "candle",
    "ml",
    "audio",
]
categories = [
    "multimedia::audio",
    "science",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/TM9657/any-tts"

[package.metadata.docs.rs]
no-default-features = true
features = ["download"]

[features]
accelerate = [
    "candle-core/accelerate",
    "candle-nn/accelerate",
    "candle-transformers/accelerate",
]
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
]
default = [
    "qwen3-tts",
    "kokoro",
    "omnivoice",
    "vibevoice",
    "voxtral",
    "download",
]
download = ["dep:reqwest"]
kokoro = [
    "dep:kana2phone",
    "dep:lindera",
    "dep:pinyin",
    "dep:voice-g2p",
]
metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
]
omnivoice = []
qwen3-tts = []
vibevoice = []
voxtral = []

[lib]
name = "any_tts"
path = "src/lib.rs"

[dependencies.base64]
version = "0.22"

[dependencies.candle-core]
version = "0.10.2"

[dependencies.candle-nn]
version = "0.10.2"

[dependencies.candle-transformers]
version = "0.10.2"

[dependencies.kana2phone]
version = "0.3"
optional = true

[dependencies.lindera]
version = "2.3.4"
features = ["embed-ipadic"]
optional = true
default-features = false

[dependencies.nanomp3]
version = "0.1.1"

[dependencies.pinyin]
version = "0.11"
features = [
    "plain",
    "with_tone_num_end",
]
optional = true
default-features = false

[dependencies.reqwest]
version = "0.12"
features = [
    "blocking",
    "rustls-tls",
]
optional = true
default-features = false

[dependencies.rustc-hash]
version = "1.1"

[dependencies.rustfft]
version = "6"

[dependencies.safetensors]
version = "0.7.0"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.thiserror]
version = "2"

[dependencies.tiktoken-rs]
version = "0.9.1"

[dependencies.tokenizers]
version = "0.22.2"

[dependencies.tracing]
version = "0.1"

[dependencies.voice-g2p]
version = "0.2.2"
optional = true

[dependencies.zip]
version = "7.2"
default-features = false
