[workspace]
resolver = "2"
members = [
	"src-tauri",
	"src-tauri/mcp-server-os-level",    # Binary disabled, library still available
	"tauri-plugin-voice-transcription",
	"crates/juno-cua",                  # Headless CUA CLI — no Tauri/GUI required
]

# Shared workspace dependencies to reduce duplication
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
whisper-rs = "0.11.0"
base64 = "0.22"
chrono = "0.4"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
once_cell = "1.19"

# Optimize for faster builds
[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
debug-assertions = true
overflow-checks = true
lto = false
panic = "unwind"
incremental = true
codegen-units = 16
rpath = false

# Fast development profile for cargo check
[profile.fast-dev]
inherits = "dev"
opt-level = 0
debug-assertions = false
overflow-checks = false

# Release optimizations
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# MUST stay "unwind". `agent/tool_logger.rs` wraps every tool execution in
# `catch_unwind` so a panicking tool surfaces as "Tool <name> panicked: ..."
# instead of taking the whole app down with it, and `catch_unwind` is a no-op
# under `panic = "abort"` — the process aborts before it can return `Err`.
# This was set to "abort", so that firewall worked in dev and silently did
# nothing in the builds people actually run. `tool_logger.rs` now fails the
# build if this is changed back.
panic = "unwind"
strip = true

# `block` 0.1.6 (unmaintained, pulled in by cocoa/objc) trips the
# `uninhabited_static` future-incompat lint that will become a hard error
# (rust-lang/rust#74840). vendor/block is the same crate with a one-line fix.
# Remove once cocoa/objc are migrated to objc2 + block2.
[patch.crates-io]
block = { path = "vendor/block" }
