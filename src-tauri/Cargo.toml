[package]
name = "juno"
version = "0.6.0"
description = "A Tauri App"
authors = ["Lacy Morrow <me@lacymorrow.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "juno_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
	"macos-private-api",
	"tray-icon",
	"unstable",
] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
computer-use-ai-sdk = { path = "./mcp-server-os-level" }
dotenvy = "0.15"
reqwest = { version = "0.12.5", features = ["json", "stream"] }
tokio = { version = "1", features = ["full", "sync"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
base64 = "0.22"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
log = "0.4"
image = { version = "0.25", default-features = false, features = [
	"png",
	"jpeg",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.4", features = ["derive"] }
tauri-plugin-notification = "2"
wait-timeout = "0.2"
futures-util = "0.3"
futures = "0.3"
tempfile = "3.10.1"
# Additions for native macOS interop
cocoa = { version = "0.25", optional = true }
objc = { version = "0.2", optional = true }
objc-sys = { version = "0.3", features = ["gnustep-2-0"] }
dispatch = { version = "0.2", optional = true }
shlex = "1.3.0"
glob = "0.3.1"
dirs = "5.0"
thiserror = "1.0"
async-trait = "0.1"
once_cell = "1.19"
tauri-plugin-global-shortcut = "2"
# Browser automation over the Chrome DevTools Protocol. Pure Rust — no bundled
# Node runtime, no 17MB driver embedded at compile time. Replaced playwright
# 0.0.20 (abandoned; its 2021 driver URL is dead, see git history).
chromiumoxide = "0.9"
ctrlc = "3.4"
window-vibrancy = "0.6.0"
# Add Rig for AI agent capabilities
rig-core = "0.2.1"
whisper-rs = { version = "0.11.0", features = ["metal"] }
hound = "3.5"
cpal = "0.15"
rubato = "0.14.1"
chrono = "0.4"
html-escape = "0.2"
uuid = { version = "1.0", features = ["v4", "serde"] }
lazy_static = "1.4"
# Voice transcription plugin
tauri-plugin-voice-transcription = { path = "../tauri-plugin-voice-transcription" }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
# Native macOS API bindings - using system commands instead of osascript with admin privileges
# logging = { path = "../logging" } # Commented out due to path issue and no current usages
# rabDab = { path = "../rabDab" }   # Commented out due to path issue and no current usages
open = "5.3"
core-graphics = "0.24.0"

# Cloud connectivity dependencies
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
ring = "0.17"
rustls = "0.23"
hmac = "0.12"
sha2 = "0.10"
toml = "0.8"
url = "2.4"
gethostname = "0.4"
tauri-plugin-websocket = "2"
regex = "1.0"
tauri-plugin-autostart = "2"
which = "6.0"
# Additional dependencies for UI Token Selection
lru = "0.12"
walkdir = "2.4"
# System-level utilities for shell session management
libc = "0.2"
cron = "0.17.0"

[target.'cfg(target_os = "macos")'.dependencies]
# Metal GPU acceleration for Kokoro-82M on Apple Silicon
any-tts = { version = "0.1", default-features = false, features = ["kokoro", "download", "metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# CPU-only fallback for non-macOS (no Metal framework available)
any-tts = { version = "0.1", default-features = false, features = ["kokoro", "download"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
default = ["custom-protocol", "macos-proxy"]
# this feature is used when building mobile applications
# mobile = ["tauri/mobile"] # Temporarily comment out if causing issues
macos-proxy = ["tauri/macos-proxy", "cocoa", "objc", "dispatch"]
custom-protocol = ["tauri/custom-protocol"]
cargo-clippy = []

[dev-dependencies]
tokio-test = "0.4"

[[test]]
name = "headless_runtime"
harness = false
