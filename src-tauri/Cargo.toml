[package]
name = "juno"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "juno_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.0.0-beta", features = ["macos-private-api", "tray-icon", "unstable"] }
tauri-plugin-opener = "2.2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
computer-use-ai-sdk = { path = "./mcp-server-os-level" }
dotenvy = "0.15"
reqwest = { version = "0.12.5", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
base64 = "0.22.1"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
log = "0.4"
image = "0.25.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5.11", features = ["derive"] }
tauri-plugin-notification = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
wait-timeout = "0.2"
futures-util = "0.3.31"
futures = "0.3"
tempfile = "3.10"
# Additions for native macOS interop
cocoa = { version = "0.25", optional = true }
objc = { version = "0.2", optional = true }
shlex = "1.3.0"
bytes = "1.10.1"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
default = ["custom-protocol", "macos-proxy"]
# this feature is used when building mobile applications
# mobile = ["tauri/mobile"] # Temporarily comment out if causing issues
macos-proxy = ["tauri/macos-proxy", "cocoa", "objc"]
custom-protocol = ["tauri/custom-protocol"]

