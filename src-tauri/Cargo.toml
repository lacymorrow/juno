[package]
name = "juno"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "juno_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.0.0-beta", features = [
	"macos-private-api",
	"tray-icon",
	"unstable",
] }
tauri-plugin-opener = "2.2.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
computer-use-ai-sdk = { path = "./mcp-server-os-level" }
dotenvy = "0.15"
reqwest = { version = "0.12.5", features = ["json", "stream"] }
tokio = { version = "1", features = ["full", "sync"] }
base64 = "0.22"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
log = "0.4"
image = { version = "0.25", default-features = false, features = [
	"png",
	"jpeg",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.4", features = ["derive"] }
tauri-plugin-notification = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
wait-timeout = "0.2"
futures-util = "0.3.31"
futures = "0.3"
tempfile = "3.10.1"
# Additions for native macOS interop
cocoa = { version = "0.25", optional = true }
objc = { version = "0.2", optional = true }
shlex = "1.3.0"
glob = "0.3.1"
dirs = "5.0"
thiserror = "1.0"
async-trait = "0.1"
once_cell = "1.17"
tauri-plugin-global-shortcut = "2.2.0"
playwright = "0.0.20"
# Add Rig for AI agent capabilities
rig-core = "0.2.1"
whisper-rs = "0.11.0"
hound = "3.5"
cpal = "0.15"
rubato = "0.14.1"
chrono = "0.4"
# logging = { path = "../logging" } # Commented out due to path issue and no current usages
# rabDab = { path = "../rabDab" }   # Commented out due to path issue and no current usages

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
default = ["custom-protocol", "macos-proxy"]
# this feature is used when building mobile applications
# mobile = ["tauri/mobile"] # Temporarily comment out if causing issues
macos-proxy = ["tauri/macos-proxy", "cocoa", "objc"]
custom-protocol = ["tauri/custom-protocol"]
