[package]
name = "computer-use-ai-sdk"
version = "0.4.4"
edition = "2021"
description = "Desktop UI automation through accessibility APIs"
authors = ["m13v, louis030195"]
repository = ""

[dependencies]
# General dependencies
tokio = { version = "1", features = ["full"] }
anyhow = "1.0.86"
tracing = "0.1.40"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0.63"
uuid = { version = "1.3", features = ["v4"] }
chrono = "0.4"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22.1"
arboard = "3.4.1"

# Server dependencies
axum = "0.6.20"
tower-http = { version = "0.4.0", features = ["cors", "trace"] }

# Common dependencies that might be needed based on original code
log = "0.4.22"
macos-accessibility-client = "0.0.1"

# macOS specific dependencies (moved here from [features])
accessibility = "0.2.0"
accessibility-sys = "0.2.0"
core-foundation = "0.10.0"
core-foundation-sys = "0.8.7"
core-graphics = "0.24.0"
image = { version = "0.25.1", features = ["png"] }
libc = "0.2"
objc = "0.2.7"
once_cell = "1.19"

# Clipboard functionality now implemented using arboard (cross-platform, modern)
# objc still needed for other platform interactions

# Add Windows dependencies if needed
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

# Add Linux dependencies if needed
[target.'cfg(target_os = "linux")'.dependencies]
# dbus, atspi, etc. (if used)

# Temporarily disabled due to API compatibility issues
# [[bin]]
# name = "server"
# path = "src/bin/main.rs"

# [features]
# cargo-clippy feature is no longer needed in modern Rust
