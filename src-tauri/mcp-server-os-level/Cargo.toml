[package]
name = "computer-use-ai-sdk"
version = "0.8.253"
edition = "2021"
description = "Desktop UI automation through accessibility APIs"
authors = ["m13v, louis030195"]
repository = ""

[dependencies]
# General dependencies
tokio = { version = "1", features = ["full"] }
anyhow = "1.0.86"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0.63"
uuid = { version = "1.3", features = ["v4"] }
chrono = "0.4"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22.1"
arboard = "3.4.1"

# Server dependencies
axum = "0.6.20"
tower-http = { version = "0.4.0", features = ["cors", "trace"] }

# Common dependencies that might be needed based on original code
log = "0.4.22"
image = { version = "0.25.1", features = ["png", "jpeg"] }
libc = "0.2"
once_cell = "1.19"

# Clipboard functionality now implemented using arboard (cross-platform, modern)

[target.'cfg(target_os = "macos")'.dependencies]
macos-accessibility-client = "0.0.1"
accessibility = "0.2.0"
accessibility-sys = "0.2.0"
core-foundation = "0.10.0"
core-foundation-sys = "0.8.7"
core-graphics = "0.24.0"
foreign-types = "0.5"
objc = "0.2.7"
# macos_14_0 only adds API (ignoresShadowsSingleWindow is used for window
# capture); SCScreenshotManager already needs macOS 14 at runtime.
screencapturekit = { version = "1.5.4", optional = true, features = ["macos_14_0"] }

# UI Automation for the Windows engine (LAC-6321). `windows` is pinned to the
# release uiautomation is built on, so the HWND and COM types are the same ones.
[target.'cfg(target_os = "windows")'.dependencies]
uiautomation = "0.25.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
] }

# Add Linux dependencies if needed
[target.'cfg(target_os = "linux")'.dependencies]
# dbus, atspi, etc. (if used)

# Temporarily disabled due to API compatibility issues
# [[bin]]
# name = "server"
# path = "src/bin/main.rs"

# [features]
# cargo-clippy feature is no longer needed in modern Rust
[features]
cargo-clippy = []
default = ["screencapturekit-backend"]
screencapturekit-backend = ["screencapturekit"]
