<?xml version="1.0" encoding="UTF-8"?>
<!--
  Juno DMG install window background.

  Source of truth for src-tauri/dmg/background@2x.png. Regenerate with
  scripts/build-dmg-background.sh after editing this file.

  Coordinates are POINTS and match src-tauri/tauri.conf.json exactly:
    content area            660 x 400   (bundle.macOS.dmg.windowSize, 660x432,
                                         minus the 32pt title bar; measured,
                                         see src-tauri/dmg/README.md)
    Juno icon centre        180, 190    (dmg.appPosition)
    Applications centre     480, 190    (dmg.applicationFolderPosition)

  Finder draws both icons at 128pt, so their graphics occupy x 116..244 and
  x 416..544, y 126..254. Labels sit below, around y 262..278.

  The idea: Juno's icon is hand-felted and outlined in a teal running stitch.
  The arrow is that same thread. It comes in from the left edge, passes
  behind the Juno icon, lifts out of it and is sewn across to Applications,
  finishing in a stitched chevron. The person's drag retraces the thread.

  Palette is sampled from the app icon (src-tauri/icons/icon.png), not
  invented:
    felt pink     #E8569B   top-left of the icon
    felt blue     #7178E1   top-right
    felt violet   #384082   bottom-left
    thread teal   #408088   the stitching round the dog (deepened to #2C7480
                            so the stitch clears 3:1 on the field)

  The field is deliberately LIGHT. Finder draws disk-image icon labels in
  black in both light and dark appearance, and that colour cannot be
  configured. On a dark field they vanish (Superwhisper's own DMG has exactly
  this flaw). Here the darkest point of the label band is #CDCDED, where black
  is 13.6:1 and the thread is 3.5:1. Do not darken the lower half without re-solving that problem.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <defs>
    <!-- Felt, washed out to a pastel: pink from the left, periwinkle to the
         right. Diagonal so it follows the light in the icon. -->
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#FBE6F1"/>
      <stop offset="0.5"  stop-color="#EDE6F8"/>
      <stop offset="1"    stop-color="#DCE2F8"/>
    </linearGradient>

    <!-- Two soft pools of saturated felt colour, one under each icon, so the
         icons sit on the brand rather than on paper. Kept faint: they are
         behind the labels too. -->
    <radialGradient id="pool-pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8569B" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#E8569B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool-blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7178E1" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7178E1" stop-opacity="0"/>
    </radialGradient>

    <!-- Felt fibre. Fine fractal noise, desaturated, multiplied in at a few
         percent. Enough to stop the field reading as a CSS gradient; not
         enough to be seen as a pattern. -->
    <filter id="felt" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
      <feComponentTransfer in="grey" result="soft">
        <feFuncA type="linear" slope="0" intercept="0.07"/>
      </feComponentTransfer>
      <feComposite in="soft" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- The thread's own shadow: the stitch sits on top of felt, so it casts
         a tight, low shadow down and right. This is what makes the dashes
         read as thread and not as a dotted line. -->
    <filter id="lift" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.9" result="b"/>
      <feOffset in="b" dx="0.6" dy="1.4" result="o"/>
      <feComponentTransfer in="o" result="s">
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- The thread fades in from the left edge: direction of travel, stated
         without an animation we cannot play. userSpaceOnUse because the
         path is near-horizontal and an objectBoundingBox gradient on a thin
         box is unreliable. -->
    <linearGradient id="thread" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="410" y2="0">
      <stop offset="0"    stop-color="#2C7480" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#2C7480" stop-opacity="0.55"/>
      <stop offset="0.62" stop-color="#2C7480" stop-opacity="1"/>
    </linearGradient>
    <!-- The sheen fades in step with the thread, or the faded run shows as
         pale ghosts of stitches. -->
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="410" y2="0">
      <stop offset="0"    stop-color="#BFE3E6" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#BFE3E6" stop-opacity="0.2"/>
      <stop offset="0.62" stop-color="#BFE3E6" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Field -->
  <rect width="660" height="400" fill="url(#field)"/>
  <ellipse cx="180" cy="196" rx="210" ry="170" fill="url(#pool-pink)"/>
  <ellipse cx="480" cy="196" rx="210" ry="170" fill="url(#pool-blue)"/>
  <rect width="660" height="400" fill="#000" filter="url(#felt)"/>

  <!-- The thread. One path: in from the left edge at the icons' centre line,
       behind the Juno icon (Finder draws the icon over it), then lifting
       into a shallow arc that lands just short of Applications. -->
  <g filter="url(#lift)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="run" d="M -6 190 L 236 190 C 280 190 296 162 326 162 C 356 162 370 190 394 190"
          stroke="url(#thread)" stroke-width="3.6" stroke-dasharray="9 6"/>
    <!-- Stitched chevron: two single stitches meeting at the tip. -->
    <path id="tip" d="M 389 179 L 403 190 L 389 201" stroke="#2C7480" stroke-width="3.6"/>
  </g>
  <!-- Thread sheen: a thin light line along the top of each stitch, the
       highlight a twisted cotton thread catches. Same dash pattern, so it
       only ever sits on a stitch. This is what separates thread from a
       dotted line. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round"
     stroke="url(#sheen)" stroke-width="1.1" transform="translate(-0.3 -0.7)">
    <use href="#run" stroke-dasharray="9 6"/>
    <use href="#tip"/>
  </g>
</svg>
