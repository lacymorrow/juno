<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Display Window</title>
  <style>
    html, body, #root {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: #eee;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }
    #content {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    img {
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <div id="content">Loading…</div>

  <script type="module">
    import { listen } from "@tauri-apps/api/event";

    const content = document.getElementById('content');

    function render(payload) {
      const { kind, payload: data } = payload;
      content.innerHTML = '';
      if (kind === 'image') {
        const img = new Image();
        img.src = typeof data === 'string' ? data : data.src;
        img.alt = 'Image';
        img.onerror = () => (content.textContent = 'Failed to load image');
        content.appendChild(img);
      } else if (kind === 'html') {
        content.innerHTML = data;
      } else if (kind === 'url') {
        const iframe = document.createElement('iframe');
        iframe.style.border = 'none';
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.src = typeof data === 'string' ? data : data.url;
        iframe.onerror = () => (content.textContent = 'Failed to load URL');
        content.appendChild(iframe);
      } else if (kind === 'widget') {
        try {
          handleWidget(data);
        } catch (err) {
          console.error(err);
          content.textContent = 'Widget error';
        }
      }
    }

    async function handleWidget(cfg) {
      if (cfg.widget === 'weather') {
        await renderWeatherWidget(cfg);
      } else if (cfg.widget === 'calendar') {
        renderCalendarWidget(cfg);
      } else {
        content.textContent = 'Unknown widget';
      }
    }

    async function renderWeatherWidget({ location }) {
      content.textContent = 'Loading weather…';
      try {
        const encoded = encodeURIComponent(location);
        const resp = await fetch(`https://wttr.in/${encoded}?format=j1`);
        if (!resp.ok) throw new Error('Weather fetch failed');
        const data = await resp.json();
        const cur = data.current_condition?.[0];
        if (!cur) throw new Error('Invalid weather data');
        content.innerHTML = `<div style="text-align:center">
           <div style="font-size:42px">${cur.temp_C}°C</div>
           <div>${location}</div>
           <div style="font-size:14px">${cur.weatherDesc?.[0]?.value ?? ''}</div>
         </div>`;
      } catch (e) {
        console.error(e);
        content.textContent = 'Failed to load weather';
      }
    }

    function renderCalendarWidget({ url }) {
      if (!url) {
        content.textContent = 'Calendar URL missing';
        return;
      }
      const iframe = document.createElement('iframe');
      iframe.style.border = 'none';
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.src = url;
      iframe.onerror = () => (content.textContent = 'Failed to load calendar');
      content.appendChild(iframe);
    }

    // Initial payload
    listen('display://init', (event) => {
      render(event.payload);
    });

    // Updates
    listen('display://update', (event) => {
      render(event.payload);
    });
  </script>
</body>
</html>
