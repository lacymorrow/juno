[package]
name = "juno-cua"
version = "0.1.0"
edition = "2021"
description = "Headless CLI for Juno Computer Use Agent tools — screenshot, click, type, scroll, and more without a GUI"
authors = ["Lacy Morrow <me@lacymorrow.com>"]

[[bin]]
name = "juno-cua"
path = "src/main.rs"

[dependencies]
computer-use-ai-sdk = { path = "../../src-tauri/mcp-server-os-level" }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
