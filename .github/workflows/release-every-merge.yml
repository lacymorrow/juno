# Cut a version for every merge to main, so history is a usable bisect trail.
#
# The rule is Lacy's and it is the ordinary one: bump on every merge, so any
# regression can be walked backwards to the exact version that introduced it.
# A version that covers three merges cannot do that.
#
# What made this possible only now: shipx prompted for confirmation even when
# the bump level was given, so it could not run unattended (lacymorrow/shipx#64).
# 0.1.24 added --yes. Everything downstream of the tag already worked.
#
# This replaces `release-on-version-change.yml` (#599) rather than joining it.
# That one fired on a push touching src-tauri/Cargo.toml and tagged whatever
# version it found. This fires on every push to main, which is a strict
# superset, and the two would have raced: a merged PR that happened to touch
# Cargo.toml triggered both, in separate concurrency groups, one tagging the
# current version while the other bumped past it. One mechanism, not two.
name: Release every merge

on:
  push:
    branches: [main]

# Serial, and never cancelled. Two releases racing would fight over the version
# in Cargo.toml, and a cancelled one could leave a tag with no build behind it.
concurrency:
  group: release-every-merge
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  release:
    # shipx's own commit lands on main and would otherwise re-trigger this
    # forever. The message it writes is the loop breaker.
    if: ${{ !startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # shipx bumps the Cargo workspace with `cargo set-version`, which lives
      # in cargo-edit and is not on the runner image. Installed as a prebuilt
      # binary rather than `cargo install`, which would compile it every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Identify the committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # No NPM_TOKEN is not a failure. shipx reports the missing credential and
      # skips the publish rather than prompting (shipx#66), so the app still
      # ships and only juno-cua lags. Add the secret and it catches up.
      - name: Bump, tag and push
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
          else
            echo "::warning::NPM_TOKEN is not set; juno-cua will not be published this run."
          fi
          bunx @lacymorrow/shipx@latest patch --yes --no-tests
          version=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      # A tag pushed with GITHUB_TOKEN does not start other workflows, which
      # GitHub enforces so automation cannot loop. Ask for the build by name
      # against the tag shipx just made. It lands as a prerelease: users on the
      # auto-updater only see it once someone promotes it with
      # `scripts/juno-build.sh promote`.
      - name: Start the release build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release-tauri.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f tag="${{ steps.release.outputs.tag }}" \
            -f prerelease=true
          echo "Requested a signed prerelease build of ${{ steps.release.outputs.tag }}."

      # There is deliberately no "confirm juno-cua reached the registry" step.
      #
      # #602 added one, and it was the only thing that ever failed this
      # workflow: 2 of 14 merges red, both on that step, both false (runs
      # 38973675118 and 39065141781). It was unsound for the gap it was written
      # to close, in two ways.
      #
      # It could not tell a failed publish from a lagging CDN. npm caches
      # packuments for up to five minutes, so a successful publish stays
      # invisible well past any budget worth spending a runner on. In
      # 39065141781 shipx published at 20:05:02 and the registry did not serve
      # 0.8.212 until 20:11:12 (370s), and `::error::` fired at 20:09:30.
      # Lengthening the loop only moves the flake.
      #
      # And it was a worse copy of a check that had already run. shipx verifies
      # its own publish (`verifyPublishedArtifact`) for ~187s with backoff,
      # against the exact version and with `--prefer-online` so a miss cannot
      # be replayed from npm's local cache. This step polled a flat 60s and read
      # the `latest` dist-tag, which is the slowest field to propagate. When
      # shipx cannot confirm it says so and adds "the publish itself succeeded",
      # because it holds the publish exit status. This step did not, so all it
      # could do was guess, loudly.
      #
      # The gap it aimed at is real: shipx warns instead of exiting non-zero
      # when a publish genuinely fails, so an unattended run goes green with
      # the app shipped and juno-cua not. That belongs in shipx, where the
      # authoritative signal lives (lacymorrow/shipx#69). Fixing
      # it there makes every consumer safe and costs this workflow nothing.
      # Re-adding a registry poll here does not fix it, and it makes a red main
      # stop meaning anything.
