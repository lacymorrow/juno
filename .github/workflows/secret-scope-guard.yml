name: Secret scope guard

# Asserts that the release credentials are scoped the way this repo says they
# are, because nothing else in CI can tell the difference.
#
# Why this exists (LAC-7194). LAC-7145 attached the `release` GitHub
# Environment to build-tauri and documented five secrets as having moved into
# it. Four of the five never moved, and the fifth value that did move was the
# one documented to stay behind. Nothing failed, nothing warned, and the
# workflow comment read as satisfied for the whole time: an Environment ADDS a
# resolution scope, it does not SUBTRACT the repository one, so a job in the
# environment resolves a still-repo-scoped secret exactly as it did before.
# A reviewed, merged, documented hardening was inert and invisible.
#
# Why the test is inverted from the obvious one. `secrets.X` resolves
# environment-first and then repository-scoped, and exposes nothing about which
# scope won, so "is this secret present in the environment" is NOT observable
# from inside build-tauri. The observable condition is the one that actually
# constitutes the exposure: a job that names NO environment can read only
# repository (and organisation) secrets, so a non-empty value in such a job
# proves a repo-scoped copy exists and is readable by any workflow on any
# branch. That is exactly what the `release` environment was created to stop.
#
# Nothing here reads a secret VALUE. Each probe interpolates `secrets.X != ''`,
# which the runner evaluates to the literal string "true" or "false" before the
# step starts, so no credential material enters the job, the log, or the
# summary.
#
# This workflow deliberately does not gate releases. A red verdict here means
# the signing key is readable too widely; it does not mean the tree is unsafe
# to ship, and blocking the release would not narrow the scope. It is cheap
# enough to run on every push to main, and the weekly schedule is the only rung
# that catches a change made in the Settings UI with no commit attached.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays, 08:17 UTC. Catches a secret re-added at repo scope through the
    # Settings UI, which touches no file and so triggers nothing else.
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    name: Release credentials are scoped as declared
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # There is deliberately NO `environment:` on this job. That absence is the
    # entire mechanism: it is what makes a non-empty probe below mean
    # "repo-scoped copy exists" rather than "secret exists somewhere".
    #
    # A pull request from a fork gets no secrets at all, so every probe would
    # read false and the repo-scoped rungs would fail for a reason that has
    # nothing to do with scoping. This repo is public, so that is reachable.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6

      - name: Compare declared scope against what a no-environment job can read
        env:
          # Each of these is the string "true" or "false", never a value.
          R_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          R_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          R_APPLE_API_KEY_P8_B64: ${{ secrets.APPLE_API_KEY_P8_B64 != '' }}
          R_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          R_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
          R_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          R_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD != '' }}
          R_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          R_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          R_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          R_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
        run: |
          set -euo pipefail

          # ---------------------------------------------------------------
          # The declaration. Every APPLE_* / TAURI_SIGNING_* secret any
          # workflow references belongs in exactly one bucket, and the rungs
          # below fail when reality disagrees with the bucket. Changing the
          # scope of a release credential is therefore a reviewed diff here,
          # not an unobservable action in the Settings UI.
          # ---------------------------------------------------------------

          # Must NOT be readable without the environment. A hit means either
          # the migration never happened or a repo-scoped copy came back.
          #
          # These three do not exist at either scope yet (LAC-7193 is adding
          # App Store Connect API key notarization). Listing them now is the
          # point: whoever creates them has to put them in the `release`
          # environment, because creating them at repo scope reddens this.
          ENV_ONLY="APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8_B64"

          # Known to still be repo-scoped, which LAC-7145 intended to change
          # and did not. Asserted PRESENT, not absent, so this bucket is a
          # tripwire rather than a silent exemption: when the migration
          # actually happens the rung reddens and says to move the name into
          # ENV_ONLY. A warn-only bucket would be the original bug again.
          PENDING="TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD APPLE_ID APPLE_PASSWORD"

          # Must stay readable without the environment. build-branch.yml names
          # no environment and signs branch builds with the certificate trio on
          # arbitrary branches, so deleting a repo-scoped copy breaks it.
          # APPLE_TEAM_ID is here because it is not a secret (it is embedded in
          # the public signing identity string), so moving it buys nothing;
          # both of its readers happen to name the environment, which is why
          # the copy added to `release` on 2026-11-05 is harmless and this
          # guard ignores it.
          REPO_SCOPED="APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID"

          fail=0
          err() { echo "::error title=Secret scope::$*"; fail=1; }

          # Rung 0: every classified name has a probe. Without this, a name in
          # ENV_ONLY whose probe I forgot to add reads unset, counts as "not
          # readable", and passes silently -- the guard's own version of the
          # bug it exists to catch.
          for name in $ENV_ONLY $PENDING $REPO_SCOPED; do
            probe="R_$name"
            if [ -z "${!probe+set}" ]; then
              err "$name is classified but has no probe. Add \"R_$name: \${{ secrets.$name != '' }}\" to this step's env."
            fi
          done

          readable() {  # true when a job with no environment can read $1
            local probe="R_$1"
            [ "${!probe-}" = "true" ]
          }

          # Rung 1: the inertness detector.
          for name in $ENV_ONLY; do
            if readable "$name"; then
              err "$name is declared environment-only but a job with NO environment can read it, so a repo-scoped (or org-scoped) copy exists and every workflow on every branch can read it. Delete the repository-scoped copy: gh secret delete $name. Adding it to the \`release\` environment does not remove it from repo scope."
            fi
          done

          # Rung 2: do not break branch builds.
          for name in $REPO_SCOPED; do
            if ! readable "$name"; then
              err "$name is declared repo-scoped but is not readable here. build-branch.yml names no environment and will fail. Restore the repository-scoped copy, or move the name out of REPO_SCOPED in this file and say why."
            fi
          done

          # Rung 3: the tripwire on the pending bucket.
          for name in $PENDING; do
            if ! readable "$name"; then
              err "$name is listed as still-pending migration but is no longer readable at repo scope, so the migration appears to have completed. Move $name from PENDING to ENV_ONLY in this file so the scoping is enforced from now on."
            fi
          done

          # Rung 4: no unclassified release credential. The API-key trio
          # arriving under LAC-7193 is exactly the case this catches.
          #
          # Scoped to APPLE_* / TAURI_SIGNING_* on purpose, not by oversight.
          # RELEASE_SSH_KEY, HOMEBREW_TAP_TOKEN and NPM_TOKEN are the same class
          # of credential but are read by jobs that name no environment, so
          # scoping them means scoping those jobs first. They are tracked in
          # docs/development/RELEASES.md ("Not yet assessed, same class") and
          # belong here once that happens.
          referenced="$(grep -rhoE 'secrets\.(APPLE|TAURI_SIGNING)[A-Z_0-9]*' .github/workflows/ \
                        | sed 's/^secrets\.//' | sort -u)"
          for name in $referenced; do
            case " $ENV_ONLY $PENDING $REPO_SCOPED " in
              *" $name "*) ;;
              *) err "$name is referenced by a workflow but is not classified in this guard, so its scope is unasserted. Add it to ENV_ONLY, PENDING or REPO_SCOPED and add its probe." ;;
            esac
          done

          # Not a failure: a classified name nothing references is dead weight,
          # but it can also be a credential provisioned ahead of its use.
          for name in $ENV_ONLY $PENDING $REPO_SCOPED; do
            case " $(echo $referenced) " in
              *" $name "*) ;;
              *) echo "::notice title=Unreferenced::$name is classified here but no workflow references it. Drop it from this guard if it is gone for good." ;;
            esac
          done

          # The verdict, where someone will actually see it. "No signal
          # anywhere" is how LAC-7145 stayed inert.
          {
            echo "## Release credential scoping"
            echo
            echo "Measured by a job that names no environment, so it reads only repository/organisation secrets."
            echo
            echo "| secret | declared | readable without the environment |"
            echo "|---|---|---|"
            for name in $ENV_ONLY; do
              readable "$name" && v="yes -- EXPOSED" || v="no"
              echo "| \`$name\` | environment-only | $v |"
            done
            for name in $PENDING; do
              readable "$name" && v="yes (migration still pending)" || v="no -- reclassify"
              echo "| \`$name\` | pending migration | $v |"
            done
            for name in $REPO_SCOPED; do
              readable "$name" && v="yes" || v="no -- MISSING"
              echo "| \`$name\` | repo-scoped | $v |"
            done
            echo
            if [ "$fail" = 0 ]; then
              echo "Scoping matches the declaration."
            else
              echo "**Scoping does not match the declaration.** See the annotations above."
            fi
            if [ -n "$PENDING" ]; then
              echo
              echo "\`PENDING\` is non-empty: LAC-7145 intended those names to be environment-only and they are still readable from any branch. Migrating them needs a human (secret values are write-only), see LAC-7194."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$fail"
