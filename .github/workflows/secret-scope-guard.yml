name: Secret scope guard

# Asserts that the release credentials are scoped the way this repo says they
# are, because nothing else in CI can tell the difference.
#
# Why this exists (LAC-7194). LAC-7145 attached the `release` GitHub
# Environment to build-tauri and documented five secrets as having moved into
# it. Four of the five never moved, and the fifth value that did move was the
# one documented to stay behind. Nothing failed, nothing warned, and the
# workflow comment read as satisfied for the whole time: an Environment ADDS a
# resolution scope, it does not SUBTRACT the repository one, so a job in the
# environment resolves a still-repo-scoped secret exactly as it did before.
# A reviewed, merged, documented hardening was inert and invisible.
#
# Why the test is inverted from the obvious one. `secrets.X` resolves
# environment-first and then repository-scoped, and exposes nothing about which
# scope won, so "is this secret present in the environment" is NOT observable
# from inside build-tauri. The observable condition is the one that actually
# constitutes the exposure: a job that names NO environment can read only
# repository (and organisation) secrets, so a non-empty value in such a job
# proves a repo-scoped copy exists and is readable by any workflow on any
# branch. That is exactly what the `release` environment was created to stop.
#
# Nothing here reads a secret VALUE. Each probe interpolates `secrets.X != ''`,
# which the runner evaluates to the literal string "true" or "false" before the
# step starts, so no credential material enters the job, the log, or the
# summary.
#
# This workflow deliberately does not gate releases. A red verdict here means
# the signing key is readable too widely; it does not mean the tree is unsafe
# to ship, and blocking the release would not narrow the scope. It is cheap
# enough to run on every push to main, and the weekly schedule is the only rung
# that catches a change made in the Settings UI with no commit attached.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays, 08:17 UTC. Catches a secret re-added at repo scope through the
    # Settings UI, which touches no file and so triggers nothing else.
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    name: Release credentials are scoped as declared
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # There is deliberately NO `environment:` on this job. That absence is the
    # entire mechanism: it is what makes a non-empty probe below mean
    # "repo-scoped copy exists" rather than "secret exists somewhere".
    #
    # A pull request from a fork gets no secrets at all, so every probe would
    # read false and the repo-scoped rungs would fail for a reason that has
    # nothing to do with scoping. This repo is public, so that is reachable.
    #
    # Dependabot is the same no-secrets case wearing a disguise: its branch
    # lives in THIS repo, so the head-repo test above passes it through. A
    # `pull_request` run it triggers is nonetheless handed the Dependabot
    # secrets store and not the Actions one, so all eleven probes read false,
    # rung 2 reports the certificate trio missing and rung 3 reports the
    # migration complete -- seven errors, none of them true, on every one of
    # the ten Dependabot PRs open on 2026-11-05. A guard that cries wolf
    # gets muted, which is the same outcome as not having one.
    #
    # Skipped rather than softened: no rung is weakened for anyone else, and
    # the push-to-main run measures the identical tree once the PR lands.
    # Nothing is lost by skipping the static rung 4 either -- Dependabot edits
    # manifests, lockfiles and `uses:` version pins, none of which can
    # introduce a `secrets.` reference for rung 4 to classify.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v6

      - name: Compare declared scope against what a no-environment job can read
        env:
          # Each of these is the string "true" or "false", never a value.
          R_RELEASE_SSH_KEY: ${{ secrets.RELEASE_SSH_KEY != '' }}
          R_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
          R_HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
          R_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          R_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          R_APPLE_API_KEY_P8_B64: ${{ secrets.APPLE_API_KEY_P8_B64 != '' }}
          R_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          R_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
          R_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          R_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          R_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD != '' }}
          R_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          R_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          R_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          R_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
        run: |
          set -euo pipefail

          # ---------------------------------------------------------------
          # The declaration. Every APPLE_* / TAURI_SIGNING_* secret any
          # workflow references belongs in exactly one bucket, and the rungs
          # below fail when reality disagrees with the bucket. Changing the
          # scope of a release credential is therefore a reviewed diff here,
          # not an unobservable action in the Settings UI.
          # ---------------------------------------------------------------

          # What "readable" means here, because it is the hinge of the whole
          # design: each probe is `secrets.X != ''`, so it answers "does a
          # non-empty value reach a job with no environment". It therefore
          # CONFLATES "the secret does not exist" with "it exists and its value
          # is the empty string". That is the right question for this guard -- an
          # empty secret carries no material to protect -- but a green verdict
          # must never be read as "that secret is absent". Nothing inside a
          # workflow can tell those apart: listing secrets needs admin scope
          # that GITHUB_TOKEN does not have.

          # Must NOT be readable without the environment. A hit means either
          # the migration never happened or a repo-scoped copy came back.
          #
          # APPLE_API_ISSUER / APPLE_API_KEY / APPLE_API_KEY_P8_B64 do not exist
          # at either scope yet (LAC-7193 is adding App Store Connect API key
          # notarization). Listing them now is the point: whoever creates them
          # has to put them in the `release` environment, because creating them
          # at repo scope reddens this.
          #
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD is here for a different reason,
          # and this guard is what found it (run 42133723611, its first real
          # run, which failed and was right to). The secret DOES exist at repo
          # scope -- `gh secret list` has shown it since 2026-09-21 -- but its
          # value is empty, so the updater signing key carries no passphrase.
          # That is the long-standing working configuration, not a break:
          # the value has not changed since 2026-09-21 and releases signed
          # successfully through 2026-10-31. ENV_ONLY is the honest bucket,
          # because there is no material to migrate AND the rung still bites
          # the case that matters: if a real passphrase is ever stored at repo
          # scope, rung 1 reddens. Worth knowing on its own terms, though --
          # the one key that can hand every install a malicious update is
          # repo-scoped with no passphrase behind it.
          #
          # CLAUDE_CODE_OAUTH_TOKEN is not a release credential but it is the
          # same class of exposure (LAC-5821): it lives only in the `ai-review`
          # Environment, read by claude-code-review.yml. A repo-scoped copy
          # would be readable by any workflow on any branch, including one
          # someone later makes publicly triggerable. Red here means a
          # repo-scoped copy exists: gh secret delete CLAUDE_CODE_OAUTH_TOKEN.
          ENV_ONLY="APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8_B64 TAURI_SIGNING_PRIVATE_KEY_PASSWORD CLAUDE_CODE_OAUTH_TOKEN"

          # Known to still be repo-scoped, which LAC-7145 intended to change
          # and did not. Asserted PRESENT, not absent, so this bucket is a
          # tripwire rather than a silent exemption: when the migration
          # actually happens the rung reddens and says to move the name into
          # ENV_ONLY. A warn-only bucket would be the original bug again.
          PENDING="TAURI_SIGNING_PRIVATE_KEY APPLE_ID APPLE_PASSWORD RELEASE_SSH_KEY NPM_TOKEN HOMEBREW_TAP_TOKEN"

          # Must stay readable without the environment. build-branch.yml names
          # no environment and signs branch builds with the certificate trio on
          # arbitrary branches, so deleting a repo-scoped copy breaks it.
          # APPLE_TEAM_ID is here because it is not a secret (it is embedded in
          # the public signing identity string), so moving it buys nothing;
          # both of its readers happen to name the environment, which is why
          # the copy added to `release` on 2026-11-05 is harmless and this
          # guard ignores it.
          REPO_SCOPED="APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID"

          fail=0
          err() { echo "::error title=Secret scope::$*"; fail=1; }

          # Actions interpolates an expression delimiter (dollar sign, then
          # two opening braces) ANYWHERE in a `run:` block, including inside a
          # shell comment, before bash ever sees it -- and there is no escape
          # sequence for it, a backslash does not help. Writing that delimiter
          # literally made GitHub try to evaluate `secrets.$name` as an
          # expression and reject the whole FILE. That also meant `on:` never
          # parsed, so `branches: [main]` did not apply, the workflow ran on a
          # feature-branch push, and it failed with no jobs and no log
          # (run 42132694689) -- a confusing symptom for a one-character cause.
          # Assembling the delimiters at runtime keeps the literal sequence out
          # of the file entirely. `actionlint` catches this class in about a
          # second; a YAML parse does not, and neither does extracting this
          # script and running it in bash, which is how it reached CI.
          # shellcheck disable=SC2016  # the single quotes are the point: these
          # must stay literal, not expand.
          OPEN='${'"{"
          CLOSE='}'"}"

          # Rung 0: every classified name has a probe. Without this, a name in
          # ENV_ONLY whose probe I forgot to add reads unset, counts as "not
          # readable", and passes silently -- the guard's own version of the
          # bug it exists to catch.
          for name in $ENV_ONLY $PENDING $REPO_SCOPED; do
            probe="R_$name"
            if [ -z "${!probe+set}" ]; then
              err "$name is classified but has no probe. Add \"R_$name: $OPEN secrets.$name != '' $CLOSE\" to this step's env."
            fi
          done

          readable() {  # true when a job with no environment can read $1
            local probe="R_$1"
            [ "${!probe-}" = "true" ]
          }

          # Rung 1: the inertness detector.
          for name in $ENV_ONLY; do
            if readable "$name"; then
              err "$name is declared environment-only but a job with NO environment can read it, so a repo-scoped (or org-scoped) copy exists and every workflow on every branch can read it. Delete the repository-scoped copy: gh secret delete $name. Adding it to an environment does not remove it from repo scope."
            fi
          done

          # Rung 2: do not break branch builds.
          for name in $REPO_SCOPED; do
            if ! readable "$name"; then
              err "$name is declared repo-scoped but is not readable here. build-branch.yml names no environment and will fail. Restore the repository-scoped copy, or move the name out of REPO_SCOPED in this file and say why."
            fi
          done

          # Rung 3: the tripwire on the pending bucket.
          for name in $PENDING; do
            if ! readable "$name"; then
              err "$name is listed as still-pending migration but is no longer readable at repo scope, so the migration appears to have completed. Move $name from PENDING to ENV_ONLY in this file so the scoping is enforced from now on."
            fi
          done

          # Rung 4: no unclassified release credential. The API-key trio
          # arriving under LAC-7193 is exactly the case this catches.
          #
          # Scoped to APPLE_* / TAURI_SIGNING_* / CLAUDE_CODE_OAUTH_TOKEN on
          # purpose, not by oversight. The first two are prefixes and match a
          # family; the third is one whole name, because it is the only
          # non-release credential this guard classifies (it is environment-only
          # in `ai-review`, see ENV_ONLY above) and there is no CLAUDE_* family
          # to sweep in.
          #
          # RELEASE_SSH_KEY, HOMEBREW_TAP_TOKEN and NPM_TOKEN are the same class
          # of credential. Assessed in LAC-7170: RELEASE_SSH_KEY and NPM_TOKEN
          # are read by a job that now names `environment: release`, so they
          # are enrolled in PENDING above (LAC-7266). HOMEBREW_TAP_TOKEN joined them
          # once release-cua became a main dispatch whose `homebrew` job names
          # `environment: release` (LAC-7267).
          # Rung 4 must not read THIS file, and the grep must not be
          # case-sensitive. Both were silent defects in the first version:
          #
          # 1. Secret names are case-insensitive to Actions -- `secrets.apple_id`
          #    resolves APPLE_ID exactly as `secrets.APPLE_ID` does -- so a
          #    case-sensitive match let a real reference evade classification.
          #    Matched with -i and folded to upper case, the spelling the
          #    buckets use.
          # 2. Every classified name necessarily appears in this file as its
          #    own `secrets.X` probe, because rung 0 requires it. A guard that
          #    greps itself therefore finds every name referenced and the
          #    "Unreferenced" notice below can NEVER fire: a dead rung that
          #    reads exactly like a passing one. Excluding this file is also
          #    correct and not merely convenient -- a probe here is this guard
          #    measuring a credential, not a workflow consuming one, which is
          #    the only thing rung 4 is about.
          #
          # $self is spelled out rather than derived so that a rename reddens
          # the guard with the line below instead of quietly re-arming (2).
          self='secret-scope-guard.yml'
          if [ ! -f ".github/workflows/$self" ]; then
            err "This file is no longer .github/workflows/$self, so rung 4 excluded nothing and greps itself: every classified name then reads as referenced and the Unreferenced notice is permanently silent. Update \$self in this file to the new name."
          fi

          # grep's exit status carries three different meanings and they
          # must not be collapsed into one: 0 found something, 1 found
          # nothing, 2 or more the search itself failed (an unreadable file,
          # a missing directory). A bare `|| true` swallows all three, and
          # under `set -o pipefail` no handling at all aborts the script with
          # no verdict and no summary, so neither is acceptable.
          #
          # 2 is the one that bites, because grep prints everything it managed
          # to read BEFORE giving up. Measured: one readable workflow plus one
          # chmod-000 workflow yields exit 2 with a NON-EMPTY result, so the
          # tripwire below would pass and rung 4 would quietly assert over a
          # partial set -- a silent pass, which is this guard's whole subject.
          # The status is therefore captured rather than discarded, and the
          # transform runs separately so it cannot overwrite it.
          set +e
          # Both spellings Actions accepts: `secrets.APPLE_X` and the index
          # form `secrets['APPLE_X']` / `secrets["APPLE_X"]` (optional space
          # after the bracket). The dotted-only pattern let the index form
          # through unclassified (LAC-7215). The third alternative came from
          # main's #957 and must survive every future edit to this pattern:
          # dropping it silently unclassifies every CLAUDE_CODE_OAUTH_TOKEN
          # reference, which is exactly rung 4's own failure mode.
          ref_pattern="secrets(\.|\[[[:space:]]*[\"'])(APPLE|TAURI_SIGNING|CLAUDE_CODE_OAUTH_TOKEN)[A-Z_0-9]*"
          raw_referenced="$(grep -rhoiE "$ref_pattern" \
                              --exclude="$self" .github/workflows/)"
          grep_status=$?
          set -e
          if [ "$grep_status" -gt 1 ]; then
            err "Rung 4's grep over .github/workflows/ failed with exit $grep_status, so it reported only the files it could read before giving up and rung 4 asserted over a partial set. Treat this run as having measured nothing."
          fi
          referenced="$(printf '%s\n' "$raw_referenced" \
                        | tr '[:lower:]' '[:upper:]' \
                        | sed 's/^SECRETS[^A-Z_0-9]*//' | sort -u | sed '/^$/d')"

          # Count tripwire. Empty is indistinguishable from "the grep broke"
          # (wrong path, --exclude swallowing everything, a renamed workflow
          # directory), and empty makes rung 4 vacuous: it iterates nothing
          # and passes. release-tauri.yml cannot sign or notarize without
          # reading at least one of these names, so zero references is a
          # broken measurement, never a clean tree. Without this, the one
          # failure mode of the exclusion above is a silent pass.
          if [ -z "$referenced" ]; then
            err "Rung 4 found no APPLE_*/TAURI_SIGNING_*/CLAUDE_CODE_OAUTH_TOKEN reference in .github/workflows/ (excluding $self), which cannot be true while release-tauri.yml signs and notarizes and claude-code-review.yml authenticates. The measurement is broken, so rung 4 asserted nothing on this run."
          fi
          for name in $referenced; do
            case " $ENV_ONLY $PENDING $REPO_SCOPED " in
              *" $name "*) ;;
              *) err "$name is referenced by a workflow but is not classified in this guard, so its scope is unasserted. Add it to ENV_ONLY, PENDING or REPO_SCOPED and add its probe." ;;
            esac
          done

          # Not a failure: a classified name nothing references is dead weight,
          # but it can also be a credential provisioned ahead of its use.
          # Reachable only because of the --exclude above; before that this
          # loop could not emit a single notice under any repo state.
          referenced_flat=" $(printf '%s' "$referenced" | tr '\n' ' ') "
          for name in $ENV_ONLY $PENDING $REPO_SCOPED; do
            case "$referenced_flat" in
              *" $name "*) ;;
              *) echo "::notice title=Unreferenced::$name is classified here but no workflow references it. Drop it from this guard if it is gone for good." ;;
            esac
          done

          # The verdict, where someone will actually see it. "No signal
          # anywhere" is how LAC-7145 stayed inert.
          {
            echo "## Release credential scoping"
            echo
            echo "Measured by a job that names no environment, so it reads only repository/organisation secrets."
            echo
            echo "| secret | declared | readable without the environment |"
            echo "|---|---|---|"
            for name in $ENV_ONLY; do
              readable "$name" && v="yes -- EXPOSED" || v="no"
              echo "| \`$name\` | environment-only | $v |"
            done
            for name in $PENDING; do
              readable "$name" && v="yes (migration still pending)" || v="no -- reclassify"
              echo "| \`$name\` | pending migration | $v |"
            done
            for name in $REPO_SCOPED; do
              readable "$name" && v="yes" || v="no -- MISSING"
              echo "| \`$name\` | repo-scoped | $v |"
            done
            echo
            if [ "$fail" = 0 ]; then
              echo "Scoping matches the declaration."
            else
              echo "**Scoping does not match the declaration.** See the annotations above."
            fi
            if [ -n "$PENDING" ]; then
              echo
              echo "\`PENDING\` is non-empty: LAC-7145 intended those names to be environment-only and they are still readable from any branch. Migrating them needs a human (secret values are write-only), see LAC-7194."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$fail"
