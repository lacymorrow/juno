name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    # The token lives ONLY in this Environment, never at repository scope
    # (LAC-5821). An Environment adds a resolution scope, it does not subtract
    # the repository one, so secret-scope-guard.yml asserts that no repo-scoped
    # copy of CLAUDE_CODE_OAUTH_TOKEN exists. Keep this Environment free of a
    # deployment branch policy (a pull_request job runs on refs/pull/N/merge and
    # would be refused) and of required reviewers (they would stall every PR).
    environment: ai-review
    # The secrets context is not allowed in `if:` expressions (workflow parse
    # error), so evaluate the presence check once here (LAC-3035).
    env:
      HAS_CLAUDE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      # Fork and Dependabot PRs get no secrets by design, so a missing token
      # there is not a fault anyone can fix.
      NO_SECRETS_BY_DESIGN: ${{ github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]' }}
    steps:
      # A green check must mean a review happened. With the token absent on a
      # same-repo PR this step fails the job, so the check is honest when the
      # token is never set or when a `claude setup-token` token expires. The
      # check is not required by the branch ruleset, so red blocks no merge
      # (LAC-5821, LAC-7216).
      - name: Fail when CLAUDE_CODE_OAUTH_TOKEN is missing on a same-repo PR
        if: env.HAS_CLAUDE_OAUTH_TOKEN != 'true' && env.NO_SECRETS_BY_DESIGN != 'true'
        run: |
          echo "::error title=No review ran::CLAUDE_CODE_OAUTH_TOKEN is not set (or is empty) in the ai-review Environment, so no Claude review ran. Run 'claude setup-token', then add it under Settings > Environments > ai-review. Never as a repository secret."
          exit 1

      - name: Notice when secrets are withheld by design
        if: env.HAS_CLAUDE_OAUTH_TOKEN != 'true' && env.NO_SECRETS_BY_DESIGN == 'true'
        run: echo "::notice::Skipping Claude review. Fork and Dependabot pull requests receive no secrets."

      - name: Checkout repository
        if: env.HAS_CLAUDE_OAUTH_TOKEN == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        if: env.HAS_CLAUDE_OAUTH_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # Long-lived OAuth token from `claude setup-token` (Claude Max subscription).
          # Replaces the pay-per-token ANTHROPIC_API_KEY, which ran out of credits (LAC-3035).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Be constructive and helpful in your feedback.
            Post your review as a comment on the PR.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
