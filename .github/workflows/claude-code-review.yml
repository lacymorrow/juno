name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      # The action fails env validation when CLAUDE_CODE_OAUTH_TOKEN is unset,
      # turning every PR check red. Skip cleanly until the secret exists (LAC-3035).
      - name: Notice when CLAUDE_CODE_OAUTH_TOKEN is missing
        if: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' }}
        run: echo "::notice::Skipping Claude review — CLAUDE_CODE_OAUTH_TOKEN repo secret is not set. Run 'claude setup-token' and 'gh secret set CLAUDE_CODE_OAUTH_TOKEN' to enable AI review (LAC-3035)."

      - name: Checkout repository
        if: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        if: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        uses: anthropics/claude-code-action@v1
        with:
          # Long-lived OAuth token from `claude setup-token` (Claude Max subscription).
          # Replaces the pay-per-token ANTHROPIC_API_KEY, which ran out of credits (LAC-3035).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Be constructive and helpful in your feedback.
            Post your review as a comment on the PR.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
