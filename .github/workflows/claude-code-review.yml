name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    # The token lives ONLY in this Environment, never at repository scope
    # (LAC-5821). An Environment adds a resolution scope, it does not subtract
    # the repository one, so secret-scope-guard.yml asserts that no repo-scoped
    # copy of CLAUDE_CODE_OAUTH_TOKEN exists. Keep this Environment free of a
    # deployment branch policy (a pull_request job runs on refs/pull/N/merge and
    # would be refused) and of required reviewers (they would stall every PR).
    environment: ai-review
    # The secrets context is not allowed in `if:` expressions (workflow parse
    # error), so evaluate the presence check once here (LAC-3035).
    env:
      HAS_CLAUDE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      # Fork and Dependabot PRs get no secrets by design, so a missing token
      # there is not a fault anyone can fix.
      NO_SECRETS_BY_DESIGN: ${{ github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]' }}
    steps:
      # A green check must mean a review happened. With the token absent on a
      # same-repo PR this step fails the job, so the check is honest when the
      # token is never set or when a `claude setup-token` token expires. The
      # check is not required by the branch ruleset, so red blocks no merge
      # (LAC-5821, LAC-7216).
      - name: Fail when CLAUDE_CODE_OAUTH_TOKEN is missing on a same-repo PR
        if: env.HAS_CLAUDE_OAUTH_TOKEN != 'true' && env.NO_SECRETS_BY_DESIGN != 'true'
        run: |
          echo "::error title=No review ran::CLAUDE_CODE_OAUTH_TOKEN is not set (or is empty) in the ai-review Environment, so no Claude review ran. Run 'claude setup-token', then add it under Settings > Environments > ai-review. Never as a repository secret."
          exit 1

      - name: Notice when secrets are withheld by design
        if: env.HAS_CLAUDE_OAUTH_TOKEN != 'true' && env.NO_SECRETS_BY_DESIGN == 'true'
        run: echo "::notice::Skipping Claude review. Fork and Dependabot pull requests receive no secrets."

      - name: Note when the review started
        id: started
        if: env.HAS_CLAUDE_OAUTH_TOKEN == 'true'
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: env.HAS_CLAUDE_OAUTH_TOKEN == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        if: env.HAS_CLAUDE_OAUTH_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # Long-lived OAuth token from `claude setup-token` (Claude Max subscription).
          # Replaces the pay-per-token ANTHROPIC_API_KEY, which ran out of credits (LAC-3035).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action runs in agent mode on pull_request, which hands Claude this
          # prompt and nothing else: no repository, no PR number. Without them
          # the review had no PR to read or comment on, reached for commands
          # outside the allow-list, was denied, and ended green having posted
          # nothing. Name both here.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The checkout is the PR's code, so open
            files for context. Read the change with `gh pr view` and
            `gh pr diff`, passing the PR number above. Those, `gh pr comment`
            and the inline comment tool are the only commands you may run.

            Give feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Be constructive and helpful in your feedback.

            Always finish by posting one top-level review comment with
            `gh pr comment <PR NUMBER> --body '<review>'`, even when you found
            nothing to change. Pass the body as one single-quoted argument: no
            heredoc, no `$(...)`, no pipe.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # A green check must mean a review was posted, not only that Claude ran.
      # Count what claude[bot] left on the PR since this job started and fail
      # when it is nothing.
      - name: Fail when the review posted nothing
        if: env.HAS_CLAUDE_OAUTH_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.started.outputs.at }}
        run: |
          count() {
            gh api "repos/$GITHUB_REPOSITORY/$1?since=$SINCE&per_page=100" \
              --jq '[.[] | select(.user.login == "claude[bot]")] | length'
          }
          top=$(count "issues/$PR/comments")
          inline=$(count "pulls/$PR/comments")
          echo "claude[bot] posted $top review comment(s) and $inline inline comment(s)."
          if [ "$((top + inline))" -eq 0 ]; then
            echo "::error title=No review posted::Claude ran but left no comment on this pull request."
            exit 1
          fi
