# Build any pushed branch into a runnable Juno.app, so nobody has to compile
# on their own Mac. `scripts/juno-build.sh` dispatches this, waits, downloads
# the artifact and installs it.
#
# Signed with the Developer ID so macOS keeps its Accessibility, Microphone
# and Screen Recording grants across builds (they are tied to the signature).
# Not notarized: notarization only matters for a file downloaded through a
# browser, and `gh run download` does not quarantine what it saves.
name: Build branch

# Also on every push to main: that run saves the release build cache on main,
# where every branch build can restore it (a cache saved on a branch is
# visible only to that branch). It also leaves a downloadable app for each
# main commit, which `juno-build main` reuses without building.
on:
  workflow_dispatch:
    inputs:
      # Apple Silicon by default, because that is what everyone on the team
      # runs and a universal build compiles both halves for twice the wait.
      # `universal-apple-darwin` is how a branch gets onto an Intel Mac at all
      # (graphite) — `juno-build --universal <branch>` passes it.
      target:
        description: "Rust target triple to build"
        required: false
        default: aarch64-apple-darwin
        type: choice
        options:
          - aarch64-apple-darwin
          - universal-apple-darwin
  push:
    branches: [main]

# A second request for the same branch replaces the first.
concurrency:
  group: build-branch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    env:
      # The `push:` trigger supplies no inputs, so default here as well.
      BUILD_TARGET: ${{ inputs.target || 'aarch64-apple-darwin' }}

    steps:
      # Full history so build.rs can stamp the build number (commit count).
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read pinned Rust toolchain
        id: toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "no channel in rust-toolchain.toml" >&2; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust (pinned toolchain)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          # Both, always: `universal-apple-darwin` is not itself an installable
          # target, it is the two halves lipo'd together, so a universal build
          # needs them both present.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          # Cargo workspace root is the repo root, so the build lands in ./target.
          # Same key as release-tauri.yml. Both save it on main (this on push,
          # that on every merge's release build); branch builds restore it.
          workspaces: ". -> target"
          shared-key: tauri-release-aarch64

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      # Same throwaway-keychain import as demo-build.yml, minus the notary
      # profile.
      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "missing required secret: $var" >&2
              exit 1
            fi
          done

          keychain="$RUNNER_TEMP/juno-signing.keychain-db"
          keychain_pw="$(openssl rand -base64 24)"
          cert_path="$RUNNER_TEMP/certificate.p12"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          security import "$cert_path" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_pw" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          security default-keychain -s "$keychain"
          rm -f "$cert_path"

      # Only the .app: no DMG, and no updater artifacts (those need the updater
      # key, and a branch build is never offered as an update).
      # Built with the release profile, so what you try is what ships. A
      # cheaper profile was measured and rejected: with dependencies cached,
      # ~20 min is rustc's front end on the juno crate, which opt-level, LTO
      # and codegen-units do not touch (22m, 21.6m, 20.6m).
      - name: Build Juno.app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          bunx tauri build --target "$BUILD_TARGET" --bundles app \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # An artifact is a zip, which drops the executable bits and symlinks an
      # .app depends on. Tar it first.
      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          app="target/$BUILD_TARGET/release/bundle/macos/Juno.app"
          [ -d "$app" ] || { echo "no Juno.app at $app" >&2; exit 1; }
          codesign --verify --deep --strict "$app"
          # Say which architectures actually made it in. A universal build that
          # quietly produced one slice would install and run fine on the runner
          # and fail only on the Intel Mac it was built for.
          lipo -info "$app/Contents/MacOS/juno" || true
          tar -czf Juno.app.tar.gz -C "$(dirname "$app")" Juno.app
          echo "name=juno-$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: Juno.app.tar.gz
          if-no-files-found: error
          retention-days: 7
