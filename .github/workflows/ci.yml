name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # TypeScript typecheck + Vite bundle. Cheap and fast; catches the most common
  # breakage class in this codebase.
  #
  # NOTE: there is deliberately no Rust `cargo check`/`test` job yet. src-tauri
  # cannot currently build from a clean checkout — the `playwright` crate
  # (v0.0.20, abandoned) downloads a hardcoded 2021 browser driver from
  # playwright.azureedge.net, which Microsoft decommissioned (now HTTP 404), so
  # its build script panics on any machine without a stale cached driver. That
  # must be fixed at the dependency level before Rust CI is reproducible.
  # See docs/ci-rust-blocker.md.
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # `bun run build` is `tsc && vite build` — gates the typecheck and bundle.
      - name: Build frontend
        run: bun run build
