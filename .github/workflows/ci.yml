name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Supersede a PR's own earlier runs. Never supersede a commit on `main`.
#
# Grouping by `github.ref` put every push to main in one group, so a second
# merge cancelled the first merge's CI: three of the twelve main runs before
# 2026-10-17 ended `cancelled`, and each of those commits still cut a release
# from a tree nothing had checked (LAC-4625). Keyed by PR number, a PR still
# cancels its own stale runs; keyed by SHA, each commit on main gets a group
# of one and so always reaches a verdict. `release-every-merge.yml` is that
# verdict's only reader, and a cancelled run would silently stop releases.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ESLint, vitest, TypeScript typecheck and the Vite bundle. Cheap and fast;
  # catches the most common breakage class in this codebase.
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # Cheapest gate first, same reasoning as `cargo fmt` in the rust job: ~9s
      # and it compiles nothing. Catches React hooks violations and breaches of
      # the "backend owns logic" boundary (localStorage, getUserMedia, raw
      # WebSocket) that tsc and vitest both pass clean. See eslint.config.js —
      # the enforced rule set is a ratchet, so a red check here is always a new
      # problem, never pre-existing debt.
      - name: Lint frontend (eslint)
        run: bun run lint

      # Vitest needs no build — run it before the build so test failures
      # surface fast. Must be `bun run test` (the vitest script); plain
      # `bun test` invokes Bun's own runner and false-fails on this suite.
      - name: Frontend tests (vitest)
        run: bun run test

      # `bun run build` is `tsc && vite build` — gates the typecheck and bundle.
      - name: Build frontend
        run: bun run build

  # actionlint over every workflow file. A workflow GitHub cannot parse does not
  # fail as a lint error: it fails with zero jobs, no log, and an `on:` that
  # matches everything, so a `branches: [main]` filter silently stops applying
  # and no check appears on the PR (LAC-7194 / PR #951: a literal expression
  # delimiter inside a `run:` comment). YAML parsing and running the extracted
  # script in bash both pass that file; only actionlint lexes the expressions.
  #
  # The binary is pinned and checked against the SHA256 published with the
  # release, not pulled through a floating action or `:latest` image: this job
  # runs on every PR in a public repo that holds the updater signing key.
  # Bumping it means changing both lines below. shellcheck (preinstalled on
  # ubuntu-latest) stays on so `run:` scripts are linted too.
  workflows:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@v6

      - name: Install actionlint (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          dir="$(mktemp -d)"
          curl -fsSL --retry 3 -o "$dir/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  $dir/$tarball" | sha256sum -c -
          tar -xzf "$dir/$tarball" -C "$dir" actionlint
          install -m 0755 "$dir/actionlint" /usr/local/bin/actionlint

      - name: Lint workflows
        run: actionlint -color

  # Rust backend: formatting, lints, and the hermetic test suite.
  #
  # This must run on macOS. src-tauri links Apple frameworks through
  # core-graphics/objc for the Computer Use APIs, so a Linux runner fails at
  # link time with "link kind `framework` is only supported on Apple targets".
  #
  # (This job was impossible until the `playwright` crate was dropped — its
  # build script downloaded a 2021 driver from a decommissioned Microsoft CDN
  # and panicked on any clean checkout. See docs/ci-rust-blocker.md.)
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Keyed on Cargo.lock; without it every run pays the full ~20min build.
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          # Cargo workspace root is the repo root, so the build lands in ./target.
          workspaces: ". -> target"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # tauri-build reads `frontendDist` (../dist) at compile time, so the
      # frontend bundle has to exist before any cargo invocation.
      - name: Build frontend for tauri-build
        run: |
          bun install
          bun run build

      # Cheapest gate first: fails in seconds without compiling anything.
      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      # `--all-targets` covers tests and examples, not just the lib — that is
      # where most of the original findings were.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # Excludes the `#[ignore]`d suites that need a live Chrome on :9222
      # (tests/browser_cdp_live.rs) — those are run by hand during QA.
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # The voice plugin is its own crate, and `--manifest-path src-tauri` does
      # not reach it: it is compiled as a dependency, so its `#[cfg(test)]`
      # code is never built and its tests never ran anywhere. The capture
      # failures and the microphone fallback are pinned by tests in there, and
      # a test that does not run is the same dead control it was written to
      # prevent.
      - name: Test the voice plugin
        run: cargo test --manifest-path tauri-plugin-voice-transcription/Cargo.toml

      # Same gap as the voice plugin, one step earlier in its life: a member
      # crate is not reached by `--manifest-path src-tauri`, which selects the
      # `juno` package alone. Without this step `audio-start-probe` would be a
      # committed binary that nothing ever compiles, and the measurement it
      # exists to preserve would rot on the first cpal bump. `-p` keeps it to
      # cpal + coreaudio; it adds seconds to a job that already built both.
      - name: Clippy the audio start probe
        run: cargo clippy -p audio-start-probe --all-targets -- -D warnings

  # The Intel half of the universal build.
  #
  # The `rust` job above compiles the runner's own architecture (arm64), so
  # nothing here ever checked x86_64 — and the release is the only build that
  # does, which makes a release the worst possible place to find out. Parakeet
  # is feature-gated to Apple Silicon (`parakeet-rs` -> `ort-sys` has no
  # prebuilt ONNX Runtime for `x86_64-apple-darwin`); the gate is a pile of
  # `#[cfg(target_arch)]`, and a missed one is invisible on an arm64 runner.
  #
  # `cargo check`, not `clippy` or `test`: this job exists to prove the Intel
  # half *compiles*. Lints are architecture-independent and the suite ran above,
  # so repeating either would only double the slowest job in CI. Tests that do
  # differ by architecture assert against `cfg!(target_arch)` and so are checked
  # here as code even though they are not run.
  rust-intel:
    name: Rust (x86_64 check)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      # Read the pin rather than using @stable. rustup honours
      # `rust-toolchain.toml` and auto-installs that toolchain with only the
      # *host* target, so `dtolnay/rust-toolchain@stable` would add
      # x86_64-apple-darwin to a toolchain cargo never invokes and the build
      # fails with `can't find crate for core`. The `rust` job above gets away
      # with @stable because it only ever needs the host target. Same reasoning,
      # same two steps, as release-tauri.yml and build-branch.yml.
      - name: Read pinned Rust toolchain
        id: toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "no channel in rust-toolchain.toml" >&2; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust (pinned toolchain)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: x86_64-apple-darwin

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          # Its own key: a cross-target build shares almost no artifacts with
          # the host-target one, and sharing the key would make each job
          # repeatedly evict the other's cache.
          shared-key: ci-x86_64

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # tauri-build reads `frontendDist` (../dist) at compile time, so the
      # frontend bundle has to exist before any cargo invocation.
      - name: Build frontend for tauri-build
        run: |
          bun install
          bun run build

      # `--all-targets` so the arch-gated `#[cfg(test)]` code is compiled too.
      # Those tests are where the Intel fallback is asserted, and a gate that
      # only breaks the test build still breaks the release.
      - name: Check (x86_64)
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --target x86_64-apple-darwin

      - name: Check the voice plugin (x86_64)
        run: cargo check --manifest-path tauri-plugin-voice-transcription/Cargo.toml --all-targets --target x86_64-apple-darwin

  # The release-failure report. It is the only thing that speaks when a release
  # build dies, it is pure text generation from three API reads, and every bug
  # it has had was a number that was wrong but looked right: a streak of 13
  # reported as 1, then 13 reported for a streak of 12, then a floor printed as
  # an exact total. That class is invisible to a reader and one render away from
  # being caught, so it is rendered here.
  #
  # Cheap on purpose: bash and jq, both already on the runner, no network, about
  # a second. It is a separate job rather than a step on `frontend` so that a
  # red check names what actually broke.
  release-report:
    name: Release failure report (render)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      # The `workflows` job above lints every `run:` block's shell through
      # actionlint, on the shellcheck preinstalled on ubuntu-latest, and says
      # so in as many words. This script used to BE such a block, so
      # extracting it to a file moved it out of that job's reach: actionlint
      # lints workflow files, not scripts. Running the same preinstalled
      # shellcheck here holds the script to exactly the standard it was held
      # to inline - no more, so this does not become a stricter gate by
      # accident, and no less, so the extraction is not a quiet loss of
      # coverage.
      #
      # Not decoration. The "no jq $-variables" constraint the streak query is
      # written around is an SC2016 finding, and a comment explaining a rule
      # outlives the rule if nothing still enforces it (LAC-7209).
      - name: Shellcheck
        run: |
          shellcheck \
            scripts/release-failure-report.sh \
            scripts/__tests__/release-failure-report.test.sh \
            scripts/notarize-dmg.sh \
            scripts/__tests__/notarize-dmg.test.sh \
            scripts/update-homebrew-formula.sh \
            scripts/__tests__/update-homebrew-formula.test.sh

      - name: Render the report against stubbed gh
        run: scripts/__tests__/release-failure-report.test.sh

      # The release notarizes a DMG exactly once, and a lost verdict costs a
      # 50-minute build (LAC-6333). The re-poll that recovers it is exercised
      # here against a stubbed notarytool, not on a tag.
      - name: Notarize the DMG against stubbed notarytool
        run: scripts/__tests__/notarize-dmg.test.sh

      # The Homebrew formula rewrite. Same class as the two above: it runs once
      # per release, against a file in a repo this one does not control, and its
      # failure mode is SILENT - a pattern that matches nothing left the job
      # green, the push assertion green, and `brew install juno-cua` on the
      # previous version (LAC-7401). Exercised here against fixture formulas
      # instead, including the reformattings that make each pattern miss.
      - name: Rewrite the Homebrew formula against fixture formulas
        run: scripts/__tests__/update-homebrew-formula.test.sh
