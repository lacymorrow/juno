name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap, fast TypeScript + bundle check on Linux. Also produces ../dist,
  # which the Rust job needs (tauri::generate_context! reads frontendDist).
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # `bun run build` is `tsc && vite build` — gates the typecheck and bundle.
      - name: Build frontend
        run: bun run build

      - name: Upload dist for the Rust job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  # Rust check + tests on macOS — juno is a macOS app and its src-tauri crate
  # links Apple frameworks (core-graphics etc.), so it cannot compile on Linux.
  # Runs only if `frontend` passed, so the pricier runner never spins on a diff
  # that already fails the cheap check.
  rust:
    name: Rust (check + test)
    needs: frontend
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context! requires ../dist to exist at compile time.
      - name: Download dist from frontend job
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
