name: Release freshness

# The watchdog for "no release has shipped" (LAC-8052). It runs on ubuntu, so
# it cannot starve in the macOS queue it is watching, and it reads the one
# artifact that matters (the canary latest.json) instead of any run status.
# A red run here is the alarm: it shows in the run list, and GitHub emails
# the user who last edited the cron line above (scheduled-workflow failures go
# to that one person, not to everyone watching Actions). It gates nothing.

on:
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    name: Merges are shipping
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/release-freshness.sh
      - run: scripts/release-freshness.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
