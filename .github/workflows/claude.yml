# .github/workflows/claude.yml
name: Claude PR Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    # The secrets context is not allowed in `if:` expressions (workflow parse
    # error), so evaluate the presence check once here (LAC-3035).
    env:
      HAS_CLAUDE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      # The action fails env validation when CLAUDE_CODE_OAUTH_TOKEN is unset.
      # Skip cleanly until the secret exists (LAC-3035).
      - name: Notice when CLAUDE_CODE_OAUTH_TOKEN is missing
        if: env.HAS_CLAUDE_OAUTH_TOKEN != 'true'
        run: echo "::notice::Skipping Claude PR assistant — CLAUDE_CODE_OAUTH_TOKEN repo secret is not set (LAC-3035)."

      - name: Checkout repository
        if: env.HAS_CLAUDE_OAUTH_TOKEN == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude PR Action
        if: env.HAS_CLAUDE_OAUTH_TOKEN == 'true'
        # Official action with OAuth token support. Replaces the unmaintained
        # grll/claude-code-action fork, whose access/refresh token secrets
        # expired in 2025 (LAC-3035).
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
