# Proves, against the real API, that a turn still writes a priced row
# (LAC-4127). The hermetic suite in `cost_log` checks the arithmetic against
# recorded frames; only a live request checks that the provider still puts
# `usage` where Juno looks for it. A provider moving that block one level
# deeper would pass every unit test and log every turn at $0.00.
#
# Manual, never on the PR path: it spends money (fractions of a cent per
# provider — cheapest catalogued model Juno can reach, one-line prompt,
# 32-token ceiling) and
# a test that bills on every push is a test people switch off.
#
# ## Which providers this can check
#
# Only the ones whose credential is a repository secret AND works. Those are
# two questions, and on 2026-10-27 all three API providers passed the first
# and failed the second (LAC-5816):
#
#   anthropic   ANTHROPIC_API_KEY   secret present, 401 invalid x-api-key.
#                                   Last set 2026-05-15. Revoked or rotated.
#   openai      OPENAI_API_KEY      secret present, authenticates, 429
#                                   credit_balance_exhausted: no credits.
#   gemini      GEMINI_API_KEY      secret present, 400 API_KEY_INVALID.
#   claude_cli  (none)              impossible here: needs a signed-in Claude
#                                   Max seat, which no GitHub runner has.
#                                   Run it locally, see the test's module docs.
#
# Fix the key, then re-dispatch. The liveness step below says which of the
# three failures you have in about ten seconds, before anything compiles.
#
# `all` therefore means the three API providers, named one by one, and NOT a
# bare `cargo test --test …` with no filter: an empty filter matches every test
# in the file including `claude_cli`, which cannot pass on a runner and would
# fail a job that had in fact verified everything it could.
#
# Asking for a provider whose credential is missing, revoked, or out of credit
# FAILS the job. A skip that reports success is how an unverified acceptance
# criterion gets signed off.
#
# ## Why the secrets sit at step level
#
# Each key is on the one step that needs it, never on the job. The checkout,
# toolchain, cache and Bun steps are third-party actions; a job-level secret
# would be in their environment too, for no reason. Repo rule from LAC-5818.
name: Cost telemetry live check

on:
  workflow_dispatch:
    inputs:
      providers:
        description: Which provider paths to verify against the live API.
        required: false
        default: all
        type: choice
        options:
          - all
          - anthropic
          - openai
          - gemini

permissions:
  contents: read

jobs:
  live:
    name: One real turn per provider
    # macOS for the same reason as the `rust` job in ci.yml: src-tauri links
    # Apple frameworks, so a Linux runner fails at link time.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # tauri-build reads `frontendDist` (../dist) at compile time.
      - name: Build frontend for tauri-build
        run: |
          bun install
          bun run build

      # Secrets cannot be read in an `if:` expression, so the credential check
      # is a step that reads them from the job environment and exits non-zero.
      # Separate from the run step on purpose: a bad key should fail in seconds,
      # not after a 20-minute compile.
      - name: Check the requested credentials are present
        env:
          FILTER: ${{ inputs.providers }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          case "${FILTER}" in
            all)       wanted="anthropic openai gemini" ;;
            anthropic|openai|gemini) wanted="${FILTER}" ;;
            claude_cli)
              echo "the Claude CLI path needs a signed-in Max seat and cannot run on a runner;" >&2
              echo "run it locally — see the module docs in src-tauri/tests/cost_telemetry_live.rs" >&2
              exit 1
              ;;
            *)
              echo "unknown provider selection: ${FILTER}" >&2
              exit 1
              ;;
          esac

          missing=""
          for provider in ${wanted}; do
            case "${provider}" in
              anthropic) [ -n "${ANTHROPIC_API_KEY:-}" ] || missing="${missing} ANTHROPIC_API_KEY" ;;
              openai)    [ -n "${OPENAI_API_KEY:-}" ]    || missing="${missing} OPENAI_API_KEY" ;;
              gemini)    [ -n "${GEMINI_API_KEY:-}" ]    || missing="${missing} GEMINI_API_KEY" ;;
            esac
          done
          if [ -n "${missing}" ]; then
            echo "missing required secret(s):${missing}" >&2
            exit 1
          fi

          echo "verifying:${wanted// / }"
          echo "WANTED=${wanted}" >> "$GITHUB_ENV"

      # Presence is not liveness, and the difference cost 29 minutes of macOS
      # CI on 2026-10-27 (LAC-5816): two runs compiled the crate for 13 and 16
      # minutes and then died on the first request, one to a key that had been
      # revoked and one to an account with no credits. The step above would
      # have called both of them present.
      #
      # So: one minimal real request per wanted provider, on the exact endpoint
      # and model the test will use, before anything is compiled. `max_tokens`
      # is 1, so this costs materially less than the test it guards.
      #
      # It must be a BILLABLE call. A free endpoint is a false green: this same
      # OpenAI key answered `200` on `GET /v1/models` with 136 models while
      # `POST /v1/chat/completions` answered `429 credit_balance_exhausted`.
      # Listing models proves authentication; only spending proves spending.
      #
      # Endpoints and model ids are read out of the Rust sources rather than
      # written here, because a model list in a second place is the drift the
      # catalog in `providers/types.rs` exists to prevent. A rename makes the
      # extraction empty and the step fails; it cannot pass on a stale value.
      - name: Check the requested credentials actually work
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          api=src-tauri/src/constants/api.rs
          types=src-tauri/src/agent/providers/types.rs

          # `const NAME: &str = "value";` -> value. Empty means renamed.
          rust_const() {
            value=$(sed -n "s/.*const $2: &str = \"\([^\"]*\)\";.*/\1/p" "$1" | head -1)
            if [ -z "${value}" ]; then
              echo "could not read $2 out of $1 — it was renamed or moved;" >&2
              echo "this probe must not run on a guessed value" >&2
              exit 1
            fi
            printf '%s' "${value}"
          }

          # Reports the HTTP status, and the body only when it is not 2xx. The
          # body of a failure is the whole diagnosis (401 vs 429 vs 404 are
          # three different people's problems); the body of a success is a
          # billed completion nobody needs in a public log.
          probe() {
            name=$1
            code=$(curl -sS -o /tmp/probe-body -w '%{http_code}' -K - || echo 000)
            case "${code}" in
              2??) echo "  ${name}: ${code} ok" ;;
              *)
                echo "  ${name}: ${code}" >&2
                sed -e 's/^/    /' /tmp/probe-body >&2 || true
                echo >&2
                return 1
                ;;
            esac
          }

          echo "probing: ${WANTED}"
          failed=0

          for provider in ${WANTED}; do
            case "${provider}" in
              anthropic)
                url=$(rust_const "$api" ANTHROPIC_API_URL)
                model=$(rust_const "$types" CLAUDE_HAIKU_4_5)
                # -K reads the config from stdin, so the key is never in argv.
                probe anthropic <<CFG || failed=1
          url = "${url}"
          request = "POST"
          header = "x-api-key: ${ANTHROPIC_API_KEY}"
          header = "anthropic-version: 2023-06-01"
          header = "content-type: application/json"
          data = "{\"model\":\"${model}\",\"max_tokens\":1,\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}"
          CFG
                ;;
              openai)
                url=$(rust_const "$api" OPENAI_API_URL)
                model=$(rust_const "$types" OPENAI_SOL_5_6)
                probe openai <<CFG || failed=1
          url = "${url}"
          request = "POST"
          header = "authorization: Bearer ${OPENAI_API_KEY}"
          header = "content-type: application/json"
          data = "{\"model\":\"${model}\",\"max_completion_tokens\":1,\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}"
          CFG
                ;;
              gemini)
                base=$(rust_const "$api" GEMINI_API_BASE)
                model=$(rust_const "$types" GEMINI_3_5_FLASH_LITE)
                probe gemini <<CFG || failed=1
          url = "${base}/${model}:generateContent"
          request = "POST"
          header = "x-goog-api-key: ${GEMINI_API_KEY}"
          header = "content-type: application/json"
          data = "{\"contents\":[{\"parts\":[{\"text\":\"hi\"}]}],\"generationConfig\":{\"maxOutputTokens\":1}}"
          CFG
                ;;
            esac
          done

          if [ "${failed}" -ne 0 ]; then
            echo "a requested credential does not work — see the status above." >&2
            echo "401/403: the key is wrong or revoked. 429: the account cannot" >&2
            echo "spend. 404 on a model: the endpoint does not serve it." >&2
            echo "Nothing was compiled; fix the credential and re-dispatch." >&2
            exit 1
          fi

      - name: One real turn per provider, then read the rows back
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # A scratch log, not the runner's cache directory: the tests assert on
          # the file's contents and read it back through `cost_log::read_log`.
          JUNO_COST_LOG_PATH: ${{ runner.temp }}/cost-log.ndjson
        run: |
          set -euo pipefail
          # ${WANTED} is this workflow's own words from the step above, never the
          # raw input, and the filters are named one by one so `claude_cli` can
          # never be swept in. `--test-threads=1`: the open run is process-global,
          # so parallel tests would attribute each other's turns.
          # shellcheck disable=SC2086
          cargo test --manifest-path src-tauri/Cargo.toml \
            --test cost_telemetry_live ${WANTED} \
            -- --ignored --nocapture --test-threads=1

      # The test's own assertions are one reader of this file; this is a second,
      # independent one. A test binary that exits 0 without running anything
      # (filter typo, harness change) would otherwise read as a pass.
      #
      # It checks the count AND the names: "at least one row" would go green on
      # a run where two of the three providers silently wrote nothing, which is
      # the exact failure this whole workflow exists to catch.
      - name: Count the rows independently
        env:
          JUNO_COST_LOG_PATH: ${{ runner.temp }}/cost-log.ndjson
        run: |
          set -euo pipefail

          if [ ! -s "${JUNO_COST_LOG_PATH}" ]; then
            echo "the live tests passed but wrote no rows — nothing was verified" >&2
            exit 1
          fi

          rows=$(grep -c . "${JUNO_COST_LOG_PATH}")
          expected=$(echo "${WANTED}" | wc -w | tr -d " ")
          echo "rows written: ${rows}, expected: ${expected}"

          failed=0
          for provider in ${WANTED}; do
            if ! grep -q "\"provider\":\"${provider}\"" "${JUNO_COST_LOG_PATH}"; then
              echo "no row for ${provider} — it was asked for and did not land" >&2
              failed=1
            fi
          done
          if [ "${rows}" -ne "${expected}" ]; then
            echo "expected exactly ${expected} row(s), found ${rows}" >&2
            failed=1
          fi
          [ "${failed}" -eq 0 ]

          {
            echo "## Cost telemetry live check"
            echo
            echo "Verified against the live API: \`${WANTED}\`"
            echo
            echo "Rows written: \`${rows}\` (expected \`${expected}\`)"
            echo
            echo '```json'
            cat "${JUNO_COST_LOG_PATH}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cost-log
          path: ${{ runner.temp }}/cost-log.ndjson
          if-no-files-found: warn
