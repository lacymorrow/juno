name: Release juno-cua

# Dispatched from main by release-every-merge.yml, never by a tag push (LAC-7267).
#
# This used to run on `cua-v*` tag pushes. The `release` environment allows
# `main` only, and a tag policy would not help: there is no tag ruleset, so
# anyone with push access can point a `cua-v*` tag at any tree. A tag-triggered
# job therefore could never be put in the environment, and HOMEBREW_TAP_TOKEN
# had to stay repo-scoped. Dispatching from main makes the run's ref `main`, so
# the `homebrew` job below can name `environment: release`.
#
# `tag` is the one caller-controlled value and the environment does not
# constrain it (it gates the ref the job runs on, not the ref it checks out), so
# the gate job validates it and resolves it to a SHA, the same shape as
# release-tauri.yml.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'CLI tag already on main (e.g., cua-v0.4.11)'
        required: true
        type: string
      allow_downgrade:
        description: 'Publish a version older than the tap serves (deliberate rollback only)'
        required: false
        type: boolean
        default: false

# No workflow-level grant: each job declares what it needs, so a change to a
# default can never silently move the release-publishing permission (LAC-7394).
permissions: {}

jobs:
  gate:
    name: Which commit may this build ship?
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.decide.outputs.sha }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          TAG_INPUT: ${{ inputs.tag }}
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
        run: |
          set -euo pipefail

          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error title=Dispatch from main::release-cua must be dispatched on main (got $REF). The homebrew job's environment is main-only and would refuse anyway; failing here keeps a stray branch from publishing a release first."
            exit 1
          fi

          if ! printf '%s' "$TAG_INPUT" | grep -Eq '^cua-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error title=Bad tag::'$TAG_INPUT' is not a cua-vX.Y.Z tag."
            exit 1
          fi

          # Resolve the tag to the commit it points at (annotated tags are
          # peeled), then require main to contain it. A tag anyone can push
          # must not choose the tree that is built and published.
          #
          # The tag is pushed before this run is dispatched, but a fresh ref can
          # still 404 briefly. A miss here fails only this run, after
          # release-every-merge has already gone green, and nothing else
          # triggers a CLI release (LAC-7394). Bounded retry: 5 tries, 4s apart.
          obj=""
          for attempt in 1 2 3 4 5; do
            if obj=$(gh api "repos/$REPO/git/ref/tags/$TAG_INPUT" --jq '.object | "\(.type) \(.sha)"'); then
              break
            fi
            obj=""
            [ "$attempt" -lt 5 ] && sleep 4
          done
          [ -n "$obj" ] || { echo "::error title=Tag not found::$TAG_INPUT did not resolve after 5 attempts."; exit 1; }
          type=${obj%% *}; sha=${obj#* }
          if [ "$type" = "tag" ]; then
            sha=$(gh api "repos/$REPO/git/tags/$sha" --jq '.object.sha')
          fi
          status=$(gh api "repos/$REPO/compare/$sha...main" --jq '.status')
          case "$status" in
            identical|ahead) ;;
            *)
              echo "::error title=Tag is not on main::$TAG_INPUT ($sha) is not an ancestor of main (compare status: $status). Refusing to build it."
              exit 1
              ;;
          esac

          # Refuse a release older than the one the tap already serves, or
          # `brew upgrade` hands everyone a months-old build. The tap is public,
          # so no token is needed. Same version is allowed (re-running a
          # published release). A deliberate rollback sets allow_downgrade.
          served=$(gh api repos/lacymorrow/homebrew-tap/contents/Formula/juno-cua.rb --jq .content | base64 -d | sed -n 's/^ *version *"\([0-9.]*\)".*/\1/p' | head -n1)
          [ -n "$served" ] || { echo "::error title=Tap version unreadable::could not read the version the tap serves."; exit 1; }
          want=${TAG_INPUT#cua-v}
          newest=$(printf '%s\n%s\n' "$served" "$want" | sort -V | tail -n1)
          if [ "$newest" != "$want" ] && [ "$ALLOW_DOWNGRADE" != "true" ]; then
            echo "::error title=Downgrade::the tap serves $served; $want is older. Set allow_downgrade to roll back on purpose."
            exit 1
          fi

          {
            echo "sha=$sha"
            echo "tag=$TAG_INPUT"
            echo "version=${TAG_INPUT#cua-v}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    runs-on: macos-latest
    # softprops/action-gh-release publishes the release.
    permissions:
      contents: write
    outputs:
      arm64: ${{ steps.sha.outputs.arm64 }}
      x64: ${{ steps.sha.outputs.x64 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.sha }}

      # The repo pins its toolchain in rust-toolchain.toml. Installing the cross
      # targets on @stable put them on a toolchain cargo never used (rustup
      # honors the pin and auto-installs it with only the host target), which
      # broke the x86_64 build. Read the pin so both stay in lockstep.
      # Same fix as release-tauri.yml.
      - name: Read pinned Rust toolchain
        id: toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "no channel in rust-toolchain.toml" >&2; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust (pinned toolchain)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build arm64
        run: cargo build -p juno-cua --release --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build -p juno-cua --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/juno-cua \
            target/x86_64-apple-darwin/release/juno-cua \
            -output juno-cua

      - name: Package archives
        run: |
          # Universal binary
          tar czf juno-cua-darwin-universal.tar.gz juno-cua

          # Arch-specific
          cp target/aarch64-apple-darwin/release/juno-cua juno-cua-arm64
          tar czf juno-cua-darwin-arm64.tar.gz -C target/aarch64-apple-darwin/release juno-cua

          cp target/x86_64-apple-darwin/release/juno-cua juno-cua-x64
          tar czf juno-cua-darwin-x64.tar.gz -C target/x86_64-apple-darwin/release juno-cua

      - name: Compute SHA256
        id: sha
        run: |
          {
            echo "arm64=$(shasum -a 256 juno-cua-darwin-arm64.tar.gz | cut -d ' ' -f 1)"
            echo "x64=$(shasum -a 256 juno-cua-darwin-x64.tar.gz | cut -d ' ' -f 1)"
            echo "universal=$(shasum -a 256 juno-cua-darwin-universal.tar.gz | cut -d ' ' -f 1)"
          } >> "$GITHUB_OUTPUT"

      # The release attaches to wherever the tag points at publish time, and
      # the cargo build above takes ~20 minutes. Assets come from the gated
      # SHA; this keeps the release's provenance pointer from drifting off it.
      - name: Re-assert the tag still points at the gated commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.gate.outputs.tag }}
          EXPECTED_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          obj=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object | "\(.type) \(.sha)"')
          type=${obj%% *}; sha=${obj#* }
          if [ "$type" = "tag" ]; then
            sha=$(gh api "repos/$REPO/git/tags/$sha" --jq '.object.sha')
          fi
          if [ "$sha" != "$EXPECTED_SHA" ]; then
            echo "::error title=Tag moved::$TAG now points at $sha, but the gate approved $EXPECTED_SHA. Refusing to publish."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          name: juno-cua ${{ needs.gate.outputs.version }}
          body: |
            ## juno-cua ${{ needs.gate.outputs.version }}

            Headless Computer Use Agent CLI for macOS.

            ### Install
            ```bash
            brew install lacymorrow/tap/juno-cua
            ```

            ### SHA256
            | Archive | SHA256 |
            |---------|--------|
            | arm64 | `${{ steps.sha.outputs.arm64 }}` |
            | x64 | `${{ steps.sha.outputs.x64 }}` |
            | universal | `${{ steps.sha.outputs.universal }}` |
          files: |
            juno-cua-darwin-arm64.tar.gz
            juno-cua-darwin-x64.tar.gz
            juno-cua-darwin-universal.tar.gz
          draft: false
          prerelease: false
          # The app's auto-updater and juno-www both read /releases/latest,
          # so a CLI release must never become Latest.
          make_latest: false

  # Only this job reads HOMEBREW_TAP_TOKEN, and it names the main-only `release`
  # environment (LAC-7267). It is split out of `build` so the environment, and
  # the token, never reach the cargo build. The token is a single-repo PAT for
  # homebrew-tap. Once it is moved into the environment and the repo-scoped
  # copy deleted, move HOMEBREW_TAP_TOKEN from PENDING to ENV_ONLY in
  # secret-scope-guard.yml.
  homebrew:
    needs: [gate, build]
    runs-on: macos-latest
    environment: release
    # Read-only: the checkout below fetches the formula rewriter. The push goes
    # to homebrew-tap with HOMEBREW_TAP_TOKEN, not GITHUB_TOKEN.
    permissions:
      contents: read
    steps:
      # The formula rewriter lives in the repo, so this job needs the tree.
      #
      # Checked out at the run's ref (main) rather than at
      # needs.gate.outputs.sha, which the build job uses: the rewriter is
      # release *tooling*, versioned with the workflow that calls it. Pinning it
      # to the built tree would mean a release dispatched for an older cua-v*
      # tag looks for a script that tree never had.
      #
      # persist-credentials: false because this job only reads a script out of
      # the tree. The default leaves GITHUB_TOKEN in the workspace's
      # .git/config, and the step below then clones a different repo with a
      # different token - no reason to leave a second credential lying next to
      # it.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Read from the environment by update-homebrew-formula.sh, rather than
          # interpolated into the shell body below.
          VERSION: ${{ needs.gate.outputs.version }}
          ARM64_SHA: ${{ needs.build.outputs.arm64 }}
          X64_SHA: ${{ needs.build.outputs.x64 }}
        run: |
          set -euo pipefail

          # Clone the tap repo
          git clone "https://x-access-token:${GH_TOKEN}@github.com/lacymorrow/homebrew-tap.git" /tmp/tap

          # Rewrite the formula AND prove the rewrite landed, before anything is
          # committed. The rewrite is three pattern substitutions against a file
          # in another repo (version, the cua-v* download urls, both
          # checksums), and a pattern that matches nothing is the failure this
          # guards: the formula stays on the previous version, nothing is
          # committed, `git commit || echo "No changes"` says so and exits 0,
          # and the ls-remote assertion below passes *vacuously* because local
          # HEAD never moved. Green release, stale tap (LAC-7401).
          #
          # In a script so those branches are tested rather than discovered on a
          # release: scripts/__tests__/update-homebrew-formula.test.sh.
          "$GITHUB_WORKSPACE/scripts/update-homebrew-formula.sh" /tmp/tap/Formula/juno-cua.rb

          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/juno-cua.rb
          # Safe to keep swallowing this now: the only way to reach it is a
          # formula the step above already proved correct on disk, which is the
          # legitimate case (re-running a release that is already published).
          git commit -m "Update juno-cua to ${VERSION}" || echo "No changes"
          # No `|| echo` on the push: a dead or under-scoped HOMEBREW_TAP_TOKEN
          # still clones (the tap is public) and must turn this job red, not
          # leave `brew install juno-cua` on a stale formula. With nothing
          # committed, push prints "Everything up-to-date" and exits 0.
          git push

          # An exit code is not proof the ref moved: confirm the tap's HEAD is
          # the commit we hold.
          REMOTE_HEAD="$(git ls-remote origin HEAD | cut -f1)"
          LOCAL_HEAD="$(git rev-parse HEAD)"
          if [ "${REMOTE_HEAD}" != "${LOCAL_HEAD}" ]; then
            echo "::error::homebrew-tap HEAD (${REMOTE_HEAD}) is not ${LOCAL_HEAD} after push; formula is stale"
            exit 1
          fi
