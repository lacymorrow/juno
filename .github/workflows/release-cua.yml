name: Release juno-cua

# Dispatched from main by release-every-merge.yml, never by a tag push (LAC-7267).
#
# This used to run on `cua-v*` tag pushes. The `release` environment allows
# `main` only, and a tag policy would not help: there is no tag ruleset, so
# anyone with push access can point a `cua-v*` tag at any tree. A tag-triggered
# job therefore could never be put in the environment, and HOMEBREW_TAP_TOKEN
# had to stay repo-scoped. Dispatching from main makes the run's ref `main`, so
# the `homebrew` job below can name `environment: release`.
#
# `tag` is the one caller-controlled value and the environment does not
# constrain it (it gates the ref the job runs on, not the ref it checks out), so
# the gate job validates it and resolves it to a SHA, the same shape as
# release-tauri.yml.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'CLI tag already on main (e.g., cua-v0.4.11)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  gate:
    name: Which commit may this build ship?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.decide.outputs.sha }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error title=Dispatch from main::release-cua must be dispatched on main (got $REF). The homebrew job's environment is main-only and would refuse anyway; failing here keeps a stray branch from publishing a release first."
            exit 1
          fi

          if ! printf '%s' "$TAG_INPUT" | grep -Eq '^cua-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error title=Bad tag::'$TAG_INPUT' is not a cua-vX.Y.Z tag."
            exit 1
          fi

          # Resolve the tag to the commit it points at (annotated tags are
          # peeled), then require main to contain it. A tag anyone can push
          # must not choose the tree that is built and published.
          obj=$(gh api "repos/$REPO/git/ref/tags/$TAG_INPUT" --jq '.object | "\(.type) \(.sha)"')
          type=${obj%% *}; sha=${obj#* }
          if [ "$type" = "tag" ]; then
            sha=$(gh api "repos/$REPO/git/tags/$sha" --jq '.object.sha')
          fi
          status=$(gh api "repos/$REPO/compare/$sha...main" --jq '.status')
          case "$status" in
            identical|ahead) ;;
            *)
              echo "::error title=Tag is not on main::$TAG_INPUT ($sha) is not an ancestor of main (compare status: $status). Refusing to build it."
              exit 1
              ;;
          esac

          {
            echo "sha=$sha"
            echo "tag=$TAG_INPUT"
            echo "version=${TAG_INPUT#cua-v}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    runs-on: macos-latest
    outputs:
      arm64: ${{ steps.sha.outputs.arm64 }}
      x64: ${{ steps.sha.outputs.x64 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.sha }}

      # The repo pins its toolchain in rust-toolchain.toml. Installing the cross
      # targets on @stable put them on a toolchain cargo never used (rustup
      # honors the pin and auto-installs it with only the host target), which
      # broke the x86_64 build. Read the pin so both stay in lockstep.
      # Same fix as release-tauri.yml.
      - name: Read pinned Rust toolchain
        id: toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "no channel in rust-toolchain.toml" >&2; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust (pinned toolchain)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build arm64
        run: cargo build -p juno-cua --release --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build -p juno-cua --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/juno-cua \
            target/x86_64-apple-darwin/release/juno-cua \
            -output juno-cua

      - name: Package archives
        run: |
          # Universal binary
          tar czf juno-cua-darwin-universal.tar.gz juno-cua

          # Arch-specific
          cp target/aarch64-apple-darwin/release/juno-cua juno-cua-arm64
          tar czf juno-cua-darwin-arm64.tar.gz -C target/aarch64-apple-darwin/release juno-cua

          cp target/x86_64-apple-darwin/release/juno-cua juno-cua-x64
          tar czf juno-cua-darwin-x64.tar.gz -C target/x86_64-apple-darwin/release juno-cua

      - name: Compute SHA256
        id: sha
        run: |
          {
            echo "arm64=$(shasum -a 256 juno-cua-darwin-arm64.tar.gz | cut -d ' ' -f 1)"
            echo "x64=$(shasum -a 256 juno-cua-darwin-x64.tar.gz | cut -d ' ' -f 1)"
            echo "universal=$(shasum -a 256 juno-cua-darwin-universal.tar.gz | cut -d ' ' -f 1)"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          name: juno-cua ${{ needs.gate.outputs.version }}
          body: |
            ## juno-cua ${{ needs.gate.outputs.version }}

            Headless Computer Use Agent CLI for macOS.

            ### Install
            ```bash
            brew install lacymorrow/tap/juno-cua
            ```

            ### SHA256
            | Archive | SHA256 |
            |---------|--------|
            | arm64 | `${{ steps.sha.outputs.arm64 }}` |
            | x64 | `${{ steps.sha.outputs.x64 }}` |
            | universal | `${{ steps.sha.outputs.universal }}` |
          files: |
            juno-cua-darwin-arm64.tar.gz
            juno-cua-darwin-x64.tar.gz
            juno-cua-darwin-universal.tar.gz
          draft: false
          prerelease: false
          # The app's auto-updater and juno-www both read /releases/latest,
          # so a CLI release must never become Latest.
          make_latest: false

  # Only this job reads HOMEBREW_TAP_TOKEN, and it names the main-only `release`
  # environment (LAC-7267). It is split out of `build` so the environment, and
  # the token, never reach the cargo build. The token is a single-repo PAT for
  # homebrew-tap. Once it is moved into the environment and the repo-scoped
  # copy deleted, move HOMEBREW_TAP_TOKEN from PENDING to ENV_ONLY in
  # secret-scope-guard.yml.
  homebrew:
    needs: [gate, build]
    runs-on: macos-latest
    environment: release
    steps:
      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ needs.gate.outputs.version }}"
          ARM64_SHA="${{ needs.build.outputs.arm64 }}"
          X64_SHA="${{ needs.build.outputs.x64 }}"

          # Clone the tap repo and update formula
          git clone "https://x-access-token:${GH_TOKEN}@github.com/lacymorrow/homebrew-tap.git" /tmp/tap
          cd /tmp/tap

          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Formula/juno-cua.rb
          # CLI assets live on the cua-v* release (see tag_name above), not the app's v* release.
          sed -i '' "s|releases/download/[^/]*/|releases/download/cua-v${VERSION}/|g" Formula/juno-cua.rb

          # Update SHA256 for arm64 (first occurrence) and x64 (second occurrence)
          python3 -c "
          import re
          with open('Formula/juno-cua.rb') as f:
              content = f.read()
          shas = ['${ARM64_SHA}', '${X64_SHA}']
          idx = [0]
          def replace_sha(m):
              i = idx[0]
              idx[0] += 1
              return f'sha256 \"{shas[i]}\"' if i < len(shas) else m.group(0)
          content = re.sub(r'sha256 \"[^\"]*\"', replace_sha, content)
          with open('Formula/juno-cua.rb', 'w') as f:
              f.write(content)
          "

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/juno-cua.rb
          git commit -m "Update juno-cua to ${VERSION}" || echo "No changes"
          git push || echo "Push failed — token may need repo scope"
