name: Release Juno

on:
  push:
    tags:
      - "v*"
  # Every merge to main dispatches this with prerelease=true (see
  # release-every-merge.yml). A prerelease stays invisible to /releases/latest,
  # which is what juno-www and the app's *stable* channel read. It is NOT
  # invisible to the app's prerelease channel: the "Publish the canary feed"
  # step below copies every build's manifest to a fixed `canary` tag, and an
  # install with "Get prereleases" on reads that instead. See
  # src-tauri/src/updater.rs.
  #
  # A tag pushed at a non-`release:` commit used to build a full release here.
  # It no longer does: build-tauri runs in the main-only `release` environment,
  # so a tag ref cannot reach the signing secrets, and the gate below fails
  # such a push with the dispatch command to use instead (LAC-7145). That
  # dispatch is not a loophole: the gate validates its `tag` input against main
  # and hands build-tauri a resolved SHA (LAC-7166).
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Publish as a prerelease (the auto-updater ignores it until promoted)"
        required: false
        default: false
        type: boolean
      # release-every-merge dispatches on main and names the tag here, so the
      # run's ref is main and its Rust cache is saved where the next release
      # build can restore it. A cache saved on a tag ref is visible to nothing
      # else, which made every release build cold (v0.8.15: 48 min).
      #
      # This is the one value a caller controls, and the `release` environment
      # does not constrain it: it gates the ref the job runs on, not the ref the
      # job checks out. The gate below therefore validates it (a real tag, a
      # commit main already contains, a `release:` bump) and resolves it to a
      # SHA that build-tauri checks out instead. See there for the attack it
      # closes (LAC-7166).
      tag:
        description: "Tag to build: a release: tag already on main (default: the ref this runs on)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  # A tag push used to start nothing. shipx pushed it with GITHUB_TOKEN, and
  # GitHub starts no workflow from that token, so the `push: tags` trigger
  # above only ever fired for a tag pushed by hand and the automated path came
  # in through the dispatch below it.
  #
  # main now requires status checks, and shipx pushes through a deploy key to
  # get past them (LAC-4625). A deploy key push *does* start workflows. So an
  # automated release now arrives twice: once from its tag, once from
  # release-every-merge's dispatch. The tag-triggered half is the dangerous
  # one, because it carries no inputs: `prerelease` would default to false and
  # publish straight to the stable channel, which is the audience that did not
  # sign up to find the bugs. That is why the `release:` marker below skips it,
  # and since LAC-7145 any other tag push fails there rather than building.
  #
  # Resolved over the API rather than read from `github.event.head_commit`,
  # which GitHub documents only as "object or null" and does not promise for
  # tag pushes. A guess there fails towards an accidental stable release.
  gate:
    name: Which commit may this build sign?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
      # The commit build-tauri checks out. Always a resolved SHA, never a ref:
      # see the `tag` input handling below for why that distinction is the
      # whole point of this job.
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ "$EVENT" != "push" ]; then
            # ---- dispatch ----
            if [ -z "${TAG_INPUT:-}" ]; then
              # No tag named, so build the ref this run was dispatched on. The
              # `release` environment on build-tauri has already refused
              # anything but main. Pin to the SHA rather than re-reading the
              # branch, so a merge landing mid-run cannot change the tree that
              # gets signed.
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "sha=$DISPATCH_SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # `tag` is the only attacker-controlled input on this workflow, and
            # the environment does not cover it. A deployment branch policy
            # gates the ref a job RUNS on; it says nothing about the ref the job
            # CHECKS OUT. Before the checks below,
            #
            #   gh workflow run release-tauri.yml --ref main -f tag=<any ref>
            #
            # satisfied the main-only policy and then built, signed and
            # notarized an arbitrary tree with the environment's credentials --
            # the exact capability the environment was added to remove, one door
            # over (LAC-7166). Everything from here to `build=true` exists to
            # make the environment mean what it claims.

            # 1. Spelling. Keeps the value out of API path traversal and out of
            #    anything that could read as an option.
            case "$TAG_INPUT" in
              -*|/*|*/|*..*|*[!A-Za-z0-9._/+-]*)
                echo "::error title=Not a tag name::'$TAG_INPUT' is not a usable tag name."
                exit 1 ;;
            esac

            # 2. It has to be a tag that exists here. The commits endpoint used
            #    next would equally resolve a branch name or a bare SHA, and
            #    this value also becomes the published release's name.
            gh api "repos/$REPO/git/ref/tags/$TAG_INPUT" --jq .ref >/dev/null || {
              echo "::error title=No such tag::$TAG_INPUT is not a tag in $REPO."
              exit 1
            }

            # Resolve to a commit SHA once, here. Every check after this line
            # reads the SHA and build-tauri checks out the SHA, so a tag
            # re-pointed between this job and the build cannot swap the tree.
            # (This endpoint dereferences an annotated tag for us.)
            sha=$(gh api "repos/$REPO/commits/$TAG_INPUT" --jq .sha)

            # 3. The tree must be one main already carries, which is the same
            #    bar the deployment branch policy sets for the run itself.
            #    `behind` = an ancestor of main, `identical` = main's head.
            #    `ahead` and `diverged` are commits main has never contained,
            #    which is precisely the hostile-branch case.
            status=$(gh api "repos/$REPO/compare/main...$sha" --jq .status)
            case "$status" in
              behind|identical) ;;
              *)
                echo "::error title=Not reachable from main::$TAG_INPUT ($sha) is '$status' relative to main. Only a commit main already contains can be built with the release credentials."
                exit 1 ;;
            esac

            # 4. And it must be a version bump shipx made -- the same `release:`
            #    marker the push path below keys on. Narrower than reachability
            #    alone and free: release-every-merge.yml only ever dispatches
            #    the tag it just cut, at a `release:` commit on main. Read by
            #    SHA, not by tag, so it describes the tree being built.
            message=$(gh api "repos/$REPO/commits/$sha" --jq '.commit.message')
            case "$message" in
              release:*) ;;
              *)
                echo "::error title=Not a release commit::$TAG_INPUT ($sha) is on main, but its commit is not a 'release:' version bump. Cut a version with 'bun run release' and let release-every-merge.yml dispatch the build."
                exit 1 ;;
            esac

            echo "::notice title=Building::$TAG_INPUT at $sha (contained in main, release: commit)."
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ---- tag push ----
          tag="${REF#refs/tags/}"
          message=$(gh api "repos/$REPO/commits/$tag" --jq '.commit.message')
          case "$message" in
            # shipx's own bump, the same marker release-every-merge.yml uses to
            # break its loop. That workflow dispatches this one for the tag with
            # prerelease=true and on main, so the Rust cache lands where the
            # next release build can restore it.
            release:*)
              echo "::notice title=Skipped::$tag points at shipx's own version bump; release-every-merge.yml dispatches this build with prerelease=true."
              echo "build=false" >> "$GITHUB_OUTPUT" ;;
            # A tag pushed at any other commit used to build a full release
            # here, and historically every minor and major version shipped
            # that way (15 such builds, the last v0.8.41 on 2026-10-01). It can
            # no longer do so: build-tauri runs in the `release` environment,
            # whose deployment branch policy allows `main` and nothing else, so
            # a tag ref is refused before its first step (LAC-7145). `v*` is
            # deliberately not in that policy, because there is no tag ruleset
            # on this repo: anyone who can push could point a v* tag at any
            # tree, and allowing tag refs would hand the signing secrets to
            # exactly the person the environment exists to stop.
            #
            # The capability is not lost, it moved one door over. A dispatch on
            # main takes the tag to build as an input, which is the same build
            # on an allowed ref:
            #   gh workflow run release-tauri.yml --ref main -f tag=<tag>
            # Naming `prerelease` explicitly there also removes the no-inputs
            # hazard described above the gate.
            #
            # Failing here rather than skipping quietly is deliberate: someone
            # who hand-pushes a release tag wants a release, and a green run
            # that published nothing is the worse answer.
            *)
              echo "::error title=Hand-pushed tags no longer build::$tag was pushed by hand. build-tauri runs in the main-only 'release' environment, so a tag ref cannot reach the signing secrets. Build it on main instead: gh workflow run release-tauri.yml --ref main -f tag=$tag -f prerelease=false"
              exit 1 ;;
          esac

  build-tauri:
    needs: gate
    # Both halves deliberately. An empty `sha` means the gate reached
    # `build=true` without resolving a commit, which it has no path to do; if a
    # later edit gives it one, checkout would fall back to the triggering ref
    # and the validation below would be silently skipped. Fail closed.
    if: needs.gate.outputs.build == 'true' && needs.gate.outputs.sha != ''
    runs-on: macos-latest
    # The updater signing key (TAURI_SIGNING_PRIVATE_KEY,
    # TAURI_SIGNING_PRIVATE_KEY_PASSWORD) and Apple's notarization credentials
    # (APPLE_ID, APPLE_PASSWORD, APPLE_API_ISSUER, APPLE_API_KEY,
    # APPLE_API_KEY_P8_B64) live in the `release` GitHub Environment, whose
    # deployment branch policy allows `main` and nothing else. A workflow pushed
    # to any other branch that names this environment is refused before its
    # first step runs, so push access to the repo is no longer enough to read
    # them (LAC-7145).
    #
    # The signing key is the one that matters most, and it is read only here
    # (the two Build steps below). The app's updater verifies the minisign
    # `pubkey` in tauri.conf.json and nothing else, so that key -- not the Apple
    # certificate -- is what can hand every install a malicious update.
    # build-branch.yml passes createUpdaterArtifacts:false and never reads it,
    # so scoping it costs branch builds nothing (LAC-7166).
    #
    # `main` is the whole build path: release-every-merge.yml dispatches this
    # workflow with --ref main, and a `v*` tag push never reaches this job at
    # all (the gate above skips shipx's own tag and fails any other). `v*` is
    # deliberately NOT in the policy: there is no tag ruleset on this repo, so
    # anyone with push access can point a v* tag at any tree, which would hand
    # the environment straight back.
    #
    # APPLE_TEAM_ID and the signing certificate itself stay repo-scoped. The
    # team ID is not a secret (it is embedded in the public signing identity
    # string), and build-branch.yml needs the certificate on arbitrary branches;
    # see the note there for why that is the lesser risk.
    environment: release

    steps:
      # The SHA the gate resolved and validated, never a ref. A deployment
      # branch policy constrains the ref this job RUNS on, not the ref it checks
      # out, so `ref: ${{ inputs.tag }}` here was enough to build a hostile tree
      # from an allowed ref (LAC-7166). The gate owns that decision now.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.sha }}

      # Cheap, and the only thing that proves the gate's verdict and this
      # checkout refer to the same tree. Same pattern as release-every-merge's
      # "Re-assert the checkout is the commit CI verified".
      - name: Re-assert the checkout is the commit the gate allowed
        env:
          EXPECTED: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          if [ "$head" != "$EXPECTED" ]; then
            echo "::error title=Wrong tree::Checked out $head but the gate allowed $EXPECTED. Refusing to sign."
            exit 1
          fi

      # The repo pins its toolchain in rust-toolchain.toml. Installing the cross
      # targets on @stable put them on a toolchain cargo never used (rustup
      # honors the pin and auto-installs it with only the host target), which
      # broke the universal build. Read the pin so both stay in lockstep.
      - name: Read pinned Rust toolchain
        id: toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "no channel in rust-toolchain.toml" >&2; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust (pinned toolchain)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          # Cargo workspace root is the repo root, so the build lands in ./target.
          # Merge builds run on the main ref (see the `tag` input), so this is
          # saved on main and the next release build restores it.
          workspaces: ". -> target"
          shared-key: tauri-release-universal

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      # Apple code signing + notarization.
      #
      # A human must add these repository secrets to enable it (Settings →
      # Secrets and variables → Actions):
      #   APPLE_CERTIFICATE            base64 of the Developer ID Application .p12
      #   APPLE_CERTIFICATE_PASSWORD   password for the .p12
      #   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Name (TEAMID)"
      #   APPLE_ID                     Apple ID email for notarization
      #   APPLE_PASSWORD               app-specific password for that Apple ID
      #   APPLE_TEAM_ID                10-character team ID
      #
      # The Tauri CLI treats an APPLE_* env var that is set-but-empty as
      # configured and then fails the build, so only export the secrets that
      # actually exist. With no secrets configured this step exports nothing
      # and the build stays unsigned (current behavior).
      - name: Configure Apple code signing (no-op until secrets are added)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Trim stray whitespace off the single-line credentials before
          # exporting them. A secret pasted into GitHub's web form very easily
          # carries a trailing newline, and `echo "${!var}"` into the heredoc
          # below preserves it, so the notary sees a password with an invisible
          # extra character and answers 401 - indistinguishable in the log from
          # a revoked password or an unreachable service.
          #
          # APPLE_CERTIFICATE is deliberately NOT in this list: it is a
          # multi-line base64 blob and its internal newlines are load-bearing.
          for var in APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            raw="${!var-}"
            [ -n "$raw" ] || continue
            clean="$(printf '%s' "$raw" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [ "${#raw}" -ne "${#clean}" ]; then
              echo "::warning::${var} carried $(( ${#raw} - ${#clean} )) whitespace character(s), now stripped. A trailing newline from a web paste is the usual cause and is enough on its own to make notarization return 401."
            fi
            printf -v "$var" '%s' "$clean" 2>/dev/null || eval "$var=\$clean"
          done

          # Say whether the stored APPLE_PASSWORD even has the shape of an
          # app-specific password. Apple's are exactly xxxx-xxxx-xxxx-xxxx
          # (19 lowercase-and-hyphen characters); a regular Apple ID password
          # in this secret returns 401 forever and looks identical in the log
          # to a transient fault. Only the length and a yes/no are printed,
          # never any part of the value.
          if [ -n "${APPLE_PASSWORD-}" ]; then
            if printf '%s' "$APPLE_PASSWORD" | grep -Eq '^[a-z]{4}-[a-z]{4}-[a-z]{4}-[a-z]{4}$'; then
              echo "APPLE_PASSWORD has the app-specific-password shape (xxxx-xxxx-xxxx-xxxx)."
            else
              echo "::warning::APPLE_PASSWORD is ${#APPLE_PASSWORD} characters and does NOT match Apple's app-specific-password shape (xxxx-xxxx-xxxx-xxxx). If this is a regular Apple ID password, every notarization will return 401 no matter how many times the build is retried. Generate an app-specific password at appleid.apple.com."
            fi
          fi

          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!var}" ]; then
              {
                echo "${var}<<JUNO_APPLE_SECRET_EOF"
                echo "${!var}"
                echo "JUNO_APPLE_SECRET_EOF"
              } >> "$GITHUB_ENV"
            fi
          done
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Apple signing secrets found: the app will be signed and notarized."
          else
            echo "No Apple signing secrets configured: building unsigned."
          fi

      # Notarization is the last thing a 50-minute build does, and it is the
      # thing that fails. Six release builds between 2026-10-27 and 2026-10-31
      # died at a notary call: four on "HTTP status code: 401. Invalid
      # credentials", one on NSURLErrorDomain -1009 "the Internet connection
      # appears to be offline" against appstoreconnect.apple.com/notary/v2/asp,
      # one on an empty notary error. Each burned ~50 minutes of compilation
      # and published nothing, so v0.8.251 and v0.8.253 have tags and no
      # release.
      #
      # That 401 is not a verdict on the password. notary/v2/asp IS the
      # app-specific-password token exchange, so a runner that cannot reach it
      # gets a 401 rather than a network error. The same unchanged credential
      # succeeded at 2026-10-30T14:18Z and 2026-10-31T00:46Z in between two
      # 401s, and a replacement password set at 2026-10-31T08:20Z then 401'd at
      # 10:11Z. Rotating the secret is the one fix that has been tried and has
      # not worked (LAC-6331).
      #
      # So ask first. notarytool history is the smallest authenticated call
      # there is: a few seconds here turns a sustained outage into a fast red
      # instead of 50 wasted minutes, and absorbs a brief blip outright. It
      # cannot catch an outage that starts after the build does, which is what
      # the retry on the build step is for.
      - name: Check the notary service
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_PASSWORD != '' && env.APPLE_TEAM_ID != '' }}
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/notary-preflight.log"
          for attempt in 1 2 3 4 5; do
            if xcrun notarytool history \
                 --apple-id "$APPLE_ID" \
                 --password "$APPLE_PASSWORD" \
                 --team-id "$APPLE_TEAM_ID" >"$log" 2>&1; then
              echo "Notary credentials accepted on attempt ${attempt}."
              exit 0
            fi
            echo "Notary check attempt ${attempt} failed:"
            sed -e 's/^/  /' "$log" || true
            [ "$attempt" = 5 ] && break
            sleep $((attempt * 20))
          done

          # Which of the two it is decides what a human should do next, and
          # the error text alone has already misled once, so say both.
          if grep -q 'status code: 401' "$log"; then
            echo "::error::Apple returned 401 on 5 attempts over ~3 minutes. That is either a revoked APPLE_PASSWORD or a degraded notary/v2/asp endpoint, and this step cannot tell them apart. Re-dispatch this tag once before touching the secret: a 401 that clears on a later run was the service. Replace APPLE_PASSWORD (an app-specific password for the APPLE_ID account, from appleid.apple.com) only when this step is red on two runs in a row."
          else
            echo "::error::Apple's notary service was unreachable on 5 attempts over ~3 minutes; see the log above. Nothing was built. Re-dispatch this tag."
          fi
          exit 1

      # Universal: both halves of every release, so Intel Macs can install and
      # update. Parakeet is the one thing that is not in both. Its ONNX Runtime
      # (parakeet-rs -> ort-sys) ships an aarch64 build only, so the dependency
      # is gated to Apple Silicon in the voice plugin's Cargo.toml and an Intel
      # Mac dictates with Whisper, which is already the default engine.
      - name: Build Tauri app (universal)
        id: build
        # Soft-fails so the retry below gets a turn. If that one fails too it
        # is a hard failure and the job goes red. See it for why.
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Without this the DMG comes out stock, silently.
          #
          # tauri-bundler appends --skip-jenkins to bundle_dmg.sh whenever
          # CI=true (crates/tauri-bundler/.../dmg/mod.rs), and --skip-jenkins
          # skips the AppleScript that applies everything under
          # bundle.macOS.dmg: the background picture and both icon positions.
          # The build still succeeds and still produces a .dmg. It just ignores
          # the whole branded layout. The flag exists because CI usually has no
          # Finder to drive; GitHub's macOS runners do have one, and the
          # "Verify the DMG" step below fails the release if that ever stops
          # being true, rather than quietly shipping a stock window.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Juno ${{ inputs.tag || github.ref_name }}"
          releaseBody: |
            ## Juno ${{ inputs.tag || github.ref_name }}

            See [CHANGELOG](https://github.com/lacymorrow/juno/blob/main/CHANGELOG.md) for details.
          releaseDraft: false
          prerelease: ${{ inputs.prerelease == true }}
          args: --target universal-apple-darwin

      # One retry, because what this guards against is a few seconds of Apple
      # being unreachable at the very end of a 50-minute build, and the cost of
      # losing that coin flip is a version that silently never ships.
      #
      # It is cheap. The attempt above left ./target populated in this same
      # job, so this one skips compilation and goes more or less straight back
      # to bundling and notarizing. That cuts both ways in our favour: a
      # genuine compile error also fails here in minutes rather than repeating
      # the full build. tauri-action resolves the release by tag, so a second
      # run reuses whatever the first created instead of duplicating it.
      #
      # GitHub Actions has neither step retry nor YAML anchors, so this block
      # is a hand copy of the one above and the two MUST be edited together.
      # Only name, id and continue-on-error may differ.
      - name: Build Tauri app (universal, retry)
        if: ${{ steps.build.outcome == 'failure' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Keeps the branded DMG layout on CI; see the attempt above.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Juno ${{ inputs.tag || github.ref_name }}"
          releaseBody: |
            ## Juno ${{ inputs.tag || github.ref_name }}

            See [CHANGELOG](https://github.com/lacymorrow/juno/blob/main/CHANGELOG.md) for details.
          releaseDraft: false
          prerelease: ${{ inputs.prerelease == true }}
          args: --target universal-apple-darwin

      # The prerelease channel's feed. Every build lands here, promoted or not,
      # so an install with "Get prereleases" on sees a merge within the hour
      # instead of waiting for someone to run `juno-build promote`.
      #
      # It is a fixed tag whose latest.json is overwritten, not a moving
      # pointer, because /releases/latest is exactly the thing that cannot see
      # prereleases. The version guard matters: release builds finish out of
      # order (v0.8.9 finished after v0.8.10), and an older build overwriting
      # this file would hand everyone a downgrade.
      - name: Publish the canary feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p feed
          if ! gh release download "$TAG" --repo "$REPO" --pattern latest.json --dir feed --clobber; then
            echo "::warning::$TAG published no latest.json; nothing to feed the canary channel."
            exit 0
          fi
          new=$(jq -r .version feed/latest.json)

          current=""
          if gh release download canary --repo "$REPO" --pattern latest.json --dir current --clobber 2>/dev/null; then
            current=$(jq -r .version current/latest.json)
          fi

          if [ -n "$current" ] && [ "$current" != "$new" ]; then
            highest=$(printf '%s\n%s\n' "$current" "$new" | sort -V | tail -1)
            if [ "$highest" != "$new" ]; then
              echo "canary is on $current; $new is older. Leaving it alone."
              exit 0
            fi
          fi

          # The canary release holds one file and must never become Latest,
          # so it is itself a prerelease.
          if ! gh release view canary --repo "$REPO" >/dev/null 2>&1; then
            gh release create canary \
              --repo "$REPO" \
              --prerelease \
              --title "Canary feed" \
              --notes "The auto-update manifest for Juno's prerelease channel. Overwritten by every release build; it is not itself a build. See src-tauri/src/updater.rs." \
              --target main
          fi
          gh release upload canary feed/latest.json --repo "$REPO" --clobber
          echo "Canary channel is on ${new}."

      # GitHub marks whichever full release was created last as Latest, and the
      # updater follows Latest. Builds finish out of order (v0.8.9 finished
      # after v0.8.10 and stole Latest), so pin it to the highest version.
      - name: Point Latest at the highest full release
        if: ${{ inputs.prerelease != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          newest=$(gh release list --repo "${{ github.repository }}" --exclude-pre-releases --exclude-drafts --limit 100 --json tagName -q '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          newest="v${newest}"
          gh release edit "$newest" --repo "${{ github.repository }}" --latest
          echo "Latest is ${newest}."

      # ---------------------------------------------------------------- DMG
      # These run LAST, after both updater channels have been pointed at this
      # build, and that ordering is deliberate.
      #
      # The updater reads .app.tar.gz + latest.json and never touches the DMG.
      # If these steps ran earlier and Apple's notary service were down, a
      # hard failure here would skip "Publish the canary feed" and silently
      # freeze the prerelease update channel on an old version — breaking
      # updates for everyone over a cosmetic-by-comparison problem with a file
      # they are not downloading. Updates advance first; the DMG is then
      # checked and the job still fails loudly if it is wrong.
      #
      # Known gap, deliberately not fixed here: tauri-action publishes the
      # release (releaseDraft: false) before this step staples, so for the few
      # minutes notarization takes, that release's DMG asset is the unstapled
      # copy. Closing it means building to a draft release and publishing
      # after verification, which reshapes the canary-feed and Latest steps
      # too — a change to the release flow that wants its own PR, filed as
      # LAC-4498. The exposure is a prerelease asset, and the website and the
      # stable channel read /releases/latest, which only moves on promotion.

      # Notarize and staple the DISK IMAGE itself.
      #
      # Tauri notarizes and staples the .app, then wraps it in a .dmg that it
      # only signs — there is no notarize call anywhere in the bundler's
      # dmg/mod.rs. Gatekeeper judges the quarantined file the person actually
      # double-clicks, which is the .dmg, so a signed-but-unnotarized disk
      # image is REJECTED ("Apple cannot check it for malicious software")
      # before the notarized app inside is ever reachable. Every Juno release
      # up to v0.8.201 shipped that way; spctl on v0.8.200 reported
      # "rejected / source=Unnotarized Developer ID" (LAC-4196).
      #
      # Stapling rewrites the file, so the copy tauri-action already attached
      # to the release is replaced below.
      - name: Notarize and staple the DMG
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' }}
        # APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID are already in the job
        # environment: the signing step above wrote them to $GITHUB_ENV, and
        # only the secrets that actually exist.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          # The signing step exports only the secrets that exist, and this one
          # is gated on APPLE_SIGNING_IDENTITY alone, so a half-configured set
          # (a revoked app-specific password, say) would otherwise surface as
          # "APPLE_PASSWORD: unbound variable" from set -u. Name what is
          # missing instead.
          missing=""
          for var in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            eval "value=\${$var:-}"
            [ -n "$value" ] || missing="$missing $var"
          done
          if [ -n "$missing" ]; then
            echo "::error::the build is signed but cannot be notarized; missing secret(s):$missing"
            echo "A signed, unnotarized DMG is rejected by Gatekeeper. Add the secret(s) or unset APPLE_SIGNING_IDENTITY." >&2
            exit 1
          fi

          shopt -s nullglob
          dmgs=(target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [ ${#dmgs[@]} -ne 1 ]; then
            echo "expected exactly one DMG, found ${#dmgs[@]}" >&2
            # The runner's /bin/bash is 3.2, where "${arr[@]}" on an EMPTY
            # array is an unbound variable under set -u — so the line meant to
            # explain the failure would fail instead, taking the diagnostic
            # with it. Same guard as scripts/tauri-build.sh.
            printf '%s\n' ${dmgs[@]+"${dmgs[@]}"} >&2
            exit 1
          fi
          dmg="${dmgs[0]}"
          echo "Notarizing $(basename "$dmg")"

          log="$RUNNER_TEMP/notary.log"
          set +e
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e

          # notarytool has been known to exit 0 on an Invalid verdict, so the
          # status line is checked as well as the exit code. Same guard as
          # scripts/tauri-build.sh, which has notarized the local build
          # correctly since #560.
          status="$(sed -n 's/^ *status: *//p' "$log" | tail -1)"
          if [ "$rc" -ne 0 ] || [ "$status" != "Accepted" ]; then
            echo "::error::notarization failed (status: ${status:-none}, exit $rc)"
            # "Invalid" alone says nothing; the log names the nested binary
            # that was unsigned or missing the hardened runtime.
            id="$(sed -n 's/^ *id: *//p' "$log" | head -1)"
            if [ -n "$id" ]; then
              xcrun notarytool log "$id" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" || true
            fi
            exit 1
          fi

          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"

          # Replace the unstapled copy tauri-action uploaded. This touches only
          # the .dmg; the updater reads .app.tar.gz + latest.json and is
          # unaffected.
          gh release upload "$TAG" "$dmg" --repo "$REPO" --clobber
          echo "Stapled and re-uploaded $(basename "$dmg")."

      # Fail the release rather than hand a stranger a disk image that is
      # Gatekeeper-blocked or has lost its branded layout. Checks signature,
      # stapled ticket, spctl verdict, the embedded background and its logical
      # size, and both icon positions read back out of the .DS_Store.
      #
      # Deliberately NOT gated on the signing identity. If the Developer ID
      # ever lapses, the signature half stops being checkable but the layout
      # half does not, and that is exactly when losing the guard would let the
      # stock-DMG regression back in unnoticed. No `if:` is needed for that: a
      # SKIPPED step is not a failed one, so this still runs when the notarize
      # step above gates itself out — while a genuinely failed build correctly
      # stops before here, instead of adding "found 0 DMGs" to the noise.
      - name: Verify the DMG
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [ ${#dmgs[@]} -ne 1 ]; then
            echo "expected exactly one DMG to verify, found ${#dmgs[@]}" >&2
            printf '%s\n' ${dmgs[@]+"${dmgs[@]}"} >&2
            exit 1
          fi
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            scripts/verify-dmg.sh "${dmgs[0]}"
          else
            echo "unsigned build: asserting the window layout only"
            scripts/verify-dmg.sh --skip-gatekeeper "${dmgs[0]}"
          fi

  # A failed release used to be silent. From v0.8.245 to v0.8.249 every build
  # died at notarization (an Apple app-specific password had been revoked)
  # and nothing said so: merges kept landing, versions kept being tagged, and
  # no build reached anyone for a day. A failure now opens one issue, which
  # GitHub notifies the owner of; later failures comment on it, and the next
  # release that builds closes it. A tag build the gate skipped is neither.
  report:
    needs: [gate, build-tauri]
    if: always() && needs.build-tauri.result != 'skipped' && needs.build-tauri.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      # To name the step that actually failed, below, instead of guessing.
      actions: read
    steps:
      - name: Open, update or close the release-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.build-tauri.result }}
          TAG: ${{ inputs.tag || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Release builds are failing"
          open=$(gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ "$RESULT" = "success" ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" --repo "$REPO" --body "Fixed: $TAG built and published. $RUN_URL"
              gh issue close "$open" --repo "$REPO"
            fi
            exit 0
          fi
          # Name the step that actually failed instead of guessing at a
          # cause. The jobs API answers immediately, while run logs are
          # usually still locked this soon after the failure, so the logs are
          # deliberately not read here.
          failed=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure") | .steps[] | select(.conclusion == "failure") | .name' \
            2>/dev/null | head -5 | paste -sd '; ' - || true)

          # The paragraph below used to read "Notarization failures (HTTP 401)
          # mean the APPLE_PASSWORD app-specific password needs replacing". It
          # asserted a cause this job cannot observe, and it was wrong: that
          # sentence opened #926, a password was rotated on the strength of it,
          # and the next build 401'd on the new one (LAC-6331). State the
          # evidence and let whoever reads the log draw the conclusion.
          #
          # A heredoc, not a quoted string: this runs only when the release is
          # already broken, which is the worst possible moment to find an
          # escaping bug, so the text carries no shell metacharacters.
          body=$(cat <<EOF
          The release build for $TAG failed, so nothing was published and nobody gets this version.

          Run: $RUN_URL
          Failed step: ${failed:-unknown, see the run}

          Read that step's log before changing anything.

          A notarization "HTTP status code: 401" does not on its own mean APPLE_PASSWORD is wrong. The endpoint behind it, notary/v2/asp, IS the app-specific-password token exchange, so a runner that cannot reach Apple gets a 401 rather than a network error. The same unchanged credential has succeeded within hours of a 401, and one rotation has already failed to fix it (LAC-6331).

          Re-dispatch the tag first:

              gh workflow run release-tauri.yml --ref main -f tag=$TAG -f prerelease=true

          Replace APPLE_PASSWORD only when the "Check the notary service" step is red on two runs in a row.
          EOF
          )
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
