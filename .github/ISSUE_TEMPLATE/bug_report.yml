name: Bug Report
description: Report a bug in Juno
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        One box is enough. Everything below it is optional, so skip whatever you don't know.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you were doing, and what Juno did instead of what you expected.
      placeholder: "When I asked Juno to..., it instead..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Juno version
      description: "Juno > About. Reports filed from inside Juno already have this."
      placeholder: "v0.8.234"
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: "Apple menu > About This Mac."
      placeholder: "26.0.1"
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: If you can make it happen again, how?
      placeholder: |
        1. Open the floating bar
        2. Say "open my calendar"
        3. Juno ...
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: "Logs are in Console.app under Juno, or in ~/Library/Logs/Juno."
