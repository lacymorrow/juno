name: Feature Request
description: Suggest a feature or improvement for Juno
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for Juno? We'd love to hear it.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or frustration this addresses.
      placeholder: "I often need to... but currently Juno..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you think this should work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about?
    validations:
      required: false
