name: Feature Request
description: Suggest a feature or improvement for Juno
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for Juno? One box is enough.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The use case or the frustration this would fix.
      placeholder: "I often need to... but currently Juno..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How should it work?
      description: Only if you already have something specific in mind.
